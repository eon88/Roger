name: Roger SaaS isolated agency pilot

on:
  pull_request:
    paths:
      - "ops/saas/**"
      - "tests/test_saas_provision.py"
      - "tests/saas_two_agency_integration.py"
      - "tests/saas_invite_integration.py"
      - "stage-clone/docker-entrypoint.sh"
      - "stage-clone/serve.py"
      - "stage-clone/agency_recovery.py"
      - "tests/test_saas_password_recovery.py"
      - "Dockerfile"
      - "migrations/**"
      - ".github/workflows/saas-two-agency-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-agencies:
    name: Two independent agency stacks (synthetic data)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests for safe provisioning
        run: python3 -m unittest discover -s tests -p 'test_saas_provision.py' -v

      - name: Build app test revision
        shell: bash
        run: |
          set -Eeuo pipefail
          short="${GITHUB_SHA:0:12}"
          docker build -t "roger-saas:$short" .
          echo "ROGER_TEST_IMAGE=roger-saas:$short" >> "$GITHUB_ENV"

      - name: Generate two fresh private stacks and start them
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/roger-saas-acceptance"
          install -d -m 700 "$root"
          echo "ROGER_SAAS_TEST_ROOT=$root" >> "$GITHUB_ENV"
          python3 ops/saas/provision_agency.py \
            --slug oaklettings --name "Oak Lettings" \
            --admin-email oak@example.test --port 29101 \
            --base-domain agents.example.com --image "$ROGER_TEST_IMAGE" \
            --output "$root/oaklettings"
          python3 ops/saas/provision_agency.py \
            --slug birchlettings --name "Birch Lettings" \
            --admin-email birch@example.test --port 29102 \
            --base-domain agents.example.com --image "$ROGER_TEST_IMAGE" \
            --output "$root/birchlettings"
          docker compose -f "$root/oaklettings/compose.yaml" -f "$GITHUB_WORKSPACE/ops/saas/staging-limits.yaml" --env-file "$root/oaklettings/.env" \
            up -d --wait --wait-timeout 180
          docker compose -f "$root/birchlettings/compose.yaml" -f "$GITHUB_WORKSPACE/ops/saas/staging-limits.yaml" --env-file "$root/birchlettings/.env" \
            up -d --wait --wait-timeout 180

      - name: Verify Hostinger staging Compose limits and unpublished ports
        shell: bash
        run: |
          set -Eeuo pipefail
          for agency in oaklettings birchlettings; do
            root="$ROGER_SAAS_TEST_ROOT/$agency"
            docker compose -f "$root/compose.yaml" \
              -f "$GITHUB_WORKSPACE/ops/saas/staging-limits.yaml" \
              --env-file "$root/.env" config --format json |
              python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          app, pg = d["services"]["app"], d["services"]["postgres"]
          assert app["labels"]["traefik.enable"] == "false", "Traefik accidentally enabled"
          # Compose versions may return memory limits as e.g. "192m" or bytes.
          def mem_correct(value, mib):
              return value == mib * 1024 * 1024 or str(value).lower() == str(mib) + "m"
          assert mem_correct(app["mem_limit"], 192), "Unexpected app cap: %r" % app["mem_limit"]
          assert mem_correct(pg["mem_limit"], 256), "Unexpected DB cap: %r" % pg["mem_limit"]
          assert abs(app["cpus"] - 0.20) < .001
          assert abs(pg["cpus"] - 0.12) < .001
          assert app["restart"] == "no" and pg["restart"] == "no"
          assert len(app["ports"]) == 1 and app["ports"][0]["host_ip"] == "127.0.0.1"
          print("PASS: staging memory/CPU/Traefik/localhost isolation")
          '
          done

      - name: Prove no cross-agency data or sessions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tests/saas_two_agency_integration.py \
            "$ROGER_SAAS_TEST_ROOT/oaklettings" "$ROGER_SAAS_TEST_ROOT/birchlettings"

      - name: Seed one verified tenant Party on disposable Agency A
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$ROGER_SAAS_TEST_ROOT/oaklettings"
          docker compose -f "$root/compose.yaml" -f "$GITHUB_WORKSPACE/ops/saas/staging-limits.yaml" --env-file "$root/.env" exec -T app python - <<'PY'
          import serve
          with serve.storage_write_lock():
              stage = serve.load_stage()
              assert stage["agency_id"] == "oaklettings"
              stage["parties"].append({
                  "id": "ci-invite-tenant-1", "kind": "person", "status": "active",
                  "roles": ["tenant"], "display_name": "Invitation Test Tenant",
                  "email": "newtenant@example.test", "account_id": None,
                  "agency_id": "oaklettings"
              })
              stage["properties"].append({
                  "id": "ci-invite-home-1", "title": "Synthetic Test Home",
                  "area": "Leeds", "lifecycle_status": "onboarding",
                  "tenant_party_id": "ci-invite-tenant-1",
                  "agency_id": "oaklettings"
              })
              serve.save_stage(stage)
          print("PASS: synthetic verified Party and property seeded in disposable Agency A")
          PY

      - name: Exercise new invitation and one-time login across two agencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tests/saas_invite_integration.py \
            "$ROGER_SAAS_TEST_ROOT/oaklettings" "$ROGER_SAAS_TEST_ROOT/birchlettings"

      - name: Rehearse agency-bound operator password recovery (synthetic only)
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$ROGER_SAAS_TEST_ROOT/oaklettings"
          docker compose -f "$root/compose.yaml" -f "$GITHUB_WORKSPACE/ops/saas/staging-limits.yaml" --env-file "$root/.env" exec -T app sh -eu -c '
            python /app/agency_recovery.py --agency oaklettings --output /run/roger-recovery/one-time.txt
            test "$(stat -c %a /run/roger-recovery/one-time.txt)" = 600
            rm -f /run/roger-recovery/one-time.txt
          '

      - name: Refuse app pointed at wrong agency
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$ROGER_SAAS_TEST_ROOT/oaklettings"
          if docker compose -f "$root/compose.yaml" -f "$GITHUB_WORKSPACE/ops/saas/staging-limits.yaml" --env-file "$root/.env" \
                run --rm --no-deps -e ROGER_AGENCY_ID=wrong-agency app; then
            echo "::error::Wrong-agency stack unexpectedly started!"
            exit 1
          fi
          echo "PASS: wrong-agency app startup was refused."

      - name: Diagnose isolated startup failure (no passwords)
        if: failure()
        shell: bash
        run: |
          for agency in oaklettings birchlettings; do
            echo "=== $agency containers ==="
            docker ps -a --filter "name=roger-$agency-" \
              --format '{{.Names}} {{.Status}}'
            echo "=== $agency app startup (only last 60 lines) ==="
            docker logs "roger-$agency-app-1" --tail 60 2>&1 || true
            echo "=== $agency database startup (only last 30 lines) ==="
            docker logs "roger-$agency-postgres-1" --tail 30 2>&1 || true
          done

      - name: Stop and remove only isolated CI containers and volumes
        if: always()
        shell: bash
        run: |
          root="$RUNNER_TEMP/roger-saas-acceptance"
          for agency in oaklettings birchlettings; do
            if [[ -f "$root/$agency/compose.yaml" ]]; then
              docker compose -f "$root/$agency/compose.yaml" --env-file "$root/$agency/.env" \
                down -v --remove-orphans || true
            fi
          done
          if [[ -d "$root" ]]; then rm -rf -- "$root"; fi
