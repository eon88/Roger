name: Deploy Roger (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roger-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, back up and deploy Roger MVP
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout deployment automation from main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Checkout Roger MVP source branch
        uses: actions/checkout@v4
        with:
          ref: feature/roger-fast-mvp-20261011
          path: application
          persist-credentials: false

      - name: Package the exact checked-out application
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C application rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          python3 -m py_compile application/stage-clone/serve.py
          test -f application/Dockerfile
          tar -czf "$RUNNER_TEMP/roger-$sha.tar.gz" \
            -C application Dockerfile stage-clone
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Prepared Roger commit $sha"

      - name: Deploy to Hostinger over pinned SSH host key
        shell: bash
        env:
          ROGER_HOST: ${{ secrets.ROGER_SSH_HOST }}
          ROGER_KEY: ${{ secrets.ROGER_SSH_PRIVATE_KEY }}
          ROGER_KNOWN_HOSTS: ${{ secrets.ROGER_SSH_KNOWN_HOSTS }}
          SOURCE_SHA: ${{ steps.archive.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$ROGER_HOST" || -z "$ROGER_KEY" || -z "$ROGER_KNOWN_HOSTS" ]]; then
            echo "::error::One-time setup required: configure ROGER_SSH_HOST, ROGER_SSH_PRIVATE_KEY and ROGER_SSH_KNOWN_HOSTS as repository Actions secrets."
            exit 1
          fi

          key_file="$RUNNER_TEMP/roger_deploy_key"
          hosts_file="$RUNNER_TEMP/roger_known_hosts"
          printf '%s\n' "$ROGER_KEY" > "$key_file"
          printf '%s\n' "$ROGER_KNOWN_HOSTS" > "$hosts_file"
          chmod 600 "$key_file" "$hosts_file"

          ssh_opts=(
            -i "$key_file"
            -o UserKnownHostsFile="$hosts_file"
            -o StrictHostKeyChecking=yes
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=20
          )

          ssh "${ssh_opts[@]}" "root@$ROGER_HOST" \
            'install -d -m 700 /root/roger-deploy/incoming'

          archive_name="$SOURCE_SHA.tar.gz"
          scp "${ssh_opts[@]}" "$RUNNER_TEMP/roger-$SOURCE_SHA.tar.gz" \
            "root@$ROGER_HOST:/root/roger-deploy/incoming/$archive_name"

          # The reviewed deployment script is taken from default branch, NOT
          # from the branch whose application code is being deployed.
          ssh "${ssh_opts[@]}" "root@$ROGER_HOST" \
            "bash -s -- '$SOURCE_SHA' '/root/roger-deploy/incoming/$archive_name'" \
            < ops/deploy-roger-mvp.sh

      - name: Deployment result
        if: success()
        run: |
          echo "### Roger deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: \`${{ steps.archive.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Website: https://agency.lifecompass.shop" >> "$GITHUB_STEP_SUMMARY"
          echo "Database and files were backed up on the VPS before switching the app." >> "$GITHUB_STEP_SUMMARY"
