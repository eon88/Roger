name: Roger isolated PostgreSQL dev

on:
  push:
    branches:
      - feature/postgres-dev-foundation-20261010
  pull_request:
    paths:
      - "deploy/postgres/**"
      - "migrations/002_mvp_relational_dev.sql"
      - "tests/test_mvp_postgres_dev.py"
      - "scripts/dev_postgres_setup.sh"
      - ".github/workflows/postgres-dev.yml"

permissions:
  contents: read

jobs:
  postgres-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: roger_dev
          POSTGRES_PASSWORD: ci-only-fake-test-password
          POSTGRES_DB: roger_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roger_dev -d roger_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ROGER_TEST_DATABASE_URL: postgresql://roger_dev:ci-only-fake-test-password@127.0.0.1:5432/roger_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check deployment script syntax
        run: bash -n scripts/dev_postgres_setup.sh
      - name: Validate private Docker Compose configuration
        run: |
          mkdir -p deploy/postgres/secrets
          printf '%s\n' 'ci-only-fake-test-password' > deploy/postgres/secrets/db_password
          docker compose -p roger-pg-dev -f deploy/postgres/compose.dev.yml config -q
          docker compose -p roger-pg-dev -f deploy/postgres/compose.dev.yml config --format json | python -c '
          import json,sys
          config=json.load(sys.stdin)
          service=config["services"]["postgres"]
          assert config["name"]=="roger-pg-dev"
          assert not service.get("ports")
          assert all(config["networks"][name]["internal"] for name in service["networks"])
          print("No public database ports: PASS")
          '
      - name: Install PostgreSQL driver
        run: python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Exercise relational schema and audit protections
        run: python -m unittest discover -s tests -p 'test_mvp_postgres_dev.py' -v
