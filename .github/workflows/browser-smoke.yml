name: Roger four-role browser smoke

on:
  push:
    branches:
      - security/roger-priority-zero-20261010
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated Chromium test tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise four real browser portals with synthetic identities
        env:
          DATA_DIR: /tmp/roger-browser-data
          BIND_HOST: 127.0.0.1
          PORT: "8901"
          ROGER_ENV: security-lab
          ROGER_LAB_HTTP_COOKIES: "1"
          ROGER_ALLOWED_ORIGINS: http://127.0.0.1:8901
        run: |
          mkdir -p "$DATA_DIR" browser-results
          python - <<'PY'
          import hashlib, json, secrets
          from pathlib import Path

          root = Path("/tmp/roger-browser-data")
          stage = json.loads(Path("stage-clone/stage.json").read_text())
          for collection in (
              "properties", "cases", "registrations", "jobs", "approvals",
              "audit_log", "appointments", "invitations", "documents",
          ):
              stage[collection] = []
          stage["parties"] = []
          stage["next_party_id"] = 1
          stage["next_case_id"] = 1

          users = {"users": [], "sessions": {}}
          for role in ("agent", "tenant", "landlord", "trades"):
              salt = secrets.token_hex(16)
              account_id = "account-" + secrets.token_hex(16)
              password = "ci-browser-test-password-only"
              users["users"].append({
                  "username": "lab-" + role,
                  "display_name": "Lab " + role,
                  "role": role,
                  "account_id": account_id,
                  "salt": salt,
                  "hash": hashlib.scrypt(
                      password.encode(), salt=bytes.fromhex(salt),
                      n=2**14, r=8, p=1
                  ).hex()
              })
              if role != "agent":
                  stage["parties"].append({
                      "id": "party-" + str(stage["next_party_id"]),
                      "kind": "person",
                      "display_name": "Lab " + role,
                      "roles": [role],
                      "status": "active",
                      "account_id": account_id
                  })
                  stage["next_party_id"] += 1

          (root / "stage.json").write_text(json.dumps(stage))
          (root / "users.json").write_text(json.dumps(users))
          print("Synthetic fixtures created: 4 accounts, 3 parties, 0 business records")
          PY

          python stage-clone/serve.py > "$RUNNER_TEMP/roger-browser-server.log" 2>&1 &
          ROGER_PID=$!
          trap 'kill "$ROGER_PID" 2>/dev/null || true' EXIT

          python - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8901/api/public", timeout=2) as response:
                      if response.status == 200:
                          print("Isolated Roger server ready")
                          break
              except Exception:
                  pass
              time.sleep(0.25)
          else:
              raise SystemExit("Isolated Roger did not become ready")
          PY

          node <<'JS'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const base = 'http://127.0.0.1:8901';
          const password = 'ci-browser-test-password-only';

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              // The public site must never invent demo listings when stage is empty.
              const publicContext = await browser.newContext();
              const publicPage = await publicContext.newPage();
              await publicPage.goto(base + '/');
              await publicPage.waitForFunction(() =>
                document.getElementById('propertyCount').textContent === '0 homes available',
                {timeout: 12000}
              );
              assert.equal(await publicPage.locator('#cards article').count(), 0);
              assert.match(await publicPage.locator('#empty').innerText(), /no homes advertised at present/i);
              console.log('PASS public homepage: zero fake listings and honest empty state');
              await publicContext.close();

              for (const role of ['agent', 'tenant', 'landlord', 'trades']) {
                const context = await browser.newContext();
                const page = await context.newPage();
                const errors = [];
                page.on('pageerror', e => errors.push(e.message));
                try {
                  await page.goto(base + '/login');
                  await page.locator('#u').fill('lab-' + role);
                  await page.locator('#p').fill(password);
                  await Promise.all([
                    page.waitForURL(base + '/' + role, {timeout: 12000}),
                    page.locator('#go').click()
                  ]);
                  await page.locator('#main[aria-busy="false"]').waitFor({timeout: 12000});
                  const data = await page.evaluate(async () => {
                    const response = await fetch('/api/stage');
                    if (!response.ok) throw new Error('stage returned ' + response.status);
                    return response.json();
                  });
                  assert.deepEqual(data.properties, []);
                  assert.deepEqual(data.jobs, []);
                  if (role !== 'agent') {
                    assert.equal(data.role, role);
                    assert.equal(Object.hasOwn(data, 'parties'), false);
                  }
                  if (role === 'agent') {
                    const views = [
                      'overview', 'cases', 'jobs', 'communications',
                      'notifications', 'tasks', 'money', 'compliance',
                      'appointments', 'documents', 'registrations',
                      'prospects', 'people', 'properties', 'history'
                    ];
                    for (const view of views) {
                      const link = page.locator('nav a[data-view="' + view + '"]');
                      if (await link.locator('xpath=ancestor::details').count()) {
                        // V5 navigation keeps secondary tools in an accessible disclosure.
                        await page.locator('nav details.mvp-more summary').click();
                      }
                      await link.click();
                    }
                  }
                  if (errors.length) throw new Error('Uncaught page errors: ' + errors.join(' | '));
                  await page.getByRole('button', {name: 'Log out'}).click();
                  await page.waitForURL(base + '/login', {timeout: 12000});
                  const who = await page.evaluate(async () =>
                    (await (await fetch('/api/whoami')).json()).authenticated
                  );
                  assert.equal(who, false);
                  console.log('PASS ' + role + ': browser login, dashboard rendering, session isolation, logout');
                } catch (e) {
                  await page.screenshot({path: 'browser-results/' + role + '-failure.png', fullPage: true}).catch(() => {});
                  throw new Error(role + ' browser smoke failed: ' + e.message);
                } finally {
                  await context.close();
                }
              }
              // Landlord property wizard -> Agent approval -> Landlord sees decision.
              const portal = async role => {
                const context=await browser.newContext();
                const page=await context.newPage();
                await page.goto(base+'/login');
                await page.locator('#u').fill('lab-'+role);
                await page.locator('#p').fill(password);
                await Promise.all([
                  page.waitForURL(base+'/'+role,{timeout:12000}),
                  page.locator('#go').click()
                ]);
                await page.locator('#main[aria-busy="false"]').waitFor({timeout:12000});
                return {context,page};
              };
              const landlordA=await portal('landlord');
              try {
                const page=landlordA.page;
                await page.locator('#prop-address').fill('12 Example Road');
                await page.locator('#prop-postcode').fill('TW9 1AA');
                await page.locator('#prop-area').fill('Richmond');
                await page.locator('#wizard-next').click();
                await page.locator('#prop-beds').fill('2');
                await page.locator('#prop-rent').fill('2250');
                await page.locator('#wizard-next').click();
                await page.locator('#wizard-next').click();
                await page.locator('#wizard-send').click();
                await page.locator('#my-submissions').getByText('Awaiting agent review').waitFor({timeout:12000});
                console.log('PASS landlord: property submitted from four-step wizard');
              } finally { await landlordA.context.close(); }
              const agentA=await portal('agent');
              try {
                const page=agentA.page;
                await page.locator('nav a[data-view="properties"]').click();
                await page.locator('#view-properties #submission-submission-1').waitFor({timeout:12000});
                await page.locator('#view-properties button[data-submission-id="submission-1"]').first().click();
                await page.locator('#view-properties #property-onboarded-1').waitFor({timeout:12000});
                const publicListings=await page.evaluate(async()=> (await (await fetch('/api/public')).json()).properties);
                assert.equal(publicListings.length,0);
                console.log('PASS agent: reviewed and approved for onboarding without publishing');
              } finally { await agentA.context.close(); }
              const landlordB=await portal('landlord');
              try {
                await landlordB.page.locator('#my-submissions').getByText('Approved for onboarding').waitFor({timeout:12000});
                assert.equal(await landlordB.page.locator('#my-props .card').count(),1);
                console.log('PASS landlord: decision and property persist across logins');
              } finally { await landlordB.context.close(); }
            } finally {
              await browser.close();
            }
            console.log('FOUR-ROLE BROWSER SMOKE PASSED');
          })().catch(err => { console.error(err.stack || err); process.exitCode = 1; });
          JS
      - name: Exercise full role-based repair journey with Chromium
        run: node tests/full_repair_browser.cjs
      - name: Verify redesigned public homepage, lead forms and mobile layout
        run: node tests/public_homepage_browser.cjs
      - name: Upload public homepage visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roger-public-redesign-preview
          path: |
            browser-results/roger-redesigned-desktop.png
            browser-results/roger-redesigned-mobile.png
            browser-results/roger-redesign-error.png
          if-no-files-found: ignore
      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roger-browser-failures
          path: browser-results/
          if-no-files-found: ignore
