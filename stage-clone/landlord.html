<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your properties | Stage portal</title>
<link rel="stylesheet" href="/dash.css">
</head>
<body>

<div class="shell">
  <header class="header">
    <div class="brand"><h1>My Portfolio</h1><span class="who">Signed in as <b id="who">…</b></span></div>
    <nav class="tabs">
      <a href="/" class="tab">Lettings site</a>
      <form action="/logout" method="POST" style="display:contents"><input type="hidden" name="intent" value="logout"><button class="tab" type="submit">Log out</button></form>
    </nav>
  </header>
  <main id="main" aria-busy="true">
  <section class="section">
    <div class="move">bills you need to approve</div>
    <div id="my-approvals"></div>
  </section>

  <section class="section">
    <div class="move">money in and out</div>
    <div id="statement"><div class="skel c"></div></div>
  </section>

  <section class="section">
    <div class="move">ongoing repairs and complaints</div>
    <div id="my-cases"><div class="skel c"></div><div class="skel l"></div></div>
  </section>

  <section class="section">
    <div class="move">your properties</div>
    <div class="grid2" id="my-props"></div>
  </section>

  <section class="section">
    <div class="move">appointments</div>
    <div id="my-appts"><div class="skel c"></div></div>
  </section>

  <section class="section">
    <div class="move">paperwork on file</div>
    <div id="my-docs"><div class="skel c"></div></div>
  </section>
  </main>
</div>
<div id="toast-host" aria-live="polite"></div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ME = "…";
const money = p => '£' + ((p ?? 0)/100).toFixed(2);
const ago = iso => { if(!iso) return ''; const m=(Date.now()-new Date(iso))/60000;
  if(m<1)return 'just now'; if(m<60)return Math.round(m)+' min ago'; if(m<1440)return Math.round(m/60)+' hours ago'; return Math.round(m/1440)+' days ago'; };
const when = iso => iso ? `<span class="when" title="${esc(new Date(iso).toLocaleString('en-GB'))}">${ago(iso)}</span>` : '';
const CASE_LABEL={reported:'reported',new:'reported',dispatched:'tradesperson sought',in_progress:'being fixed',awaiting_approval:'waiting on you or already decided',resolved:'sorted & paid',declined:'quote declined — agent deciding next step',closed:'closed',open:'reported'};
async function api(p){const r=await fetch(p);if(!r.ok)throw new Error(r.status);return r.json();}
async function post(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
  const j=await r.json().catch(()=>({})); if(!r.ok){toast(j.error||'failed','bad');throw new Error(j.error);} return j;}
function toast(m,k){const el=document.createElement('div');el.className='toast '+(k||'');el.textContent=m;
  document.getElementById('toast-host').appendChild(el);setTimeout(()=>el.remove(),3500);}
let stage, prevStatus={}, appts=[], docs=[];
async function boot(){
  try{ const w=await api('/api/whoami'); if(!w.role){location='/login';return;} ME=w.display_name; await load(); }
  catch(e){ toast('Could not reach the portal. Try reloading in a moment.','bad'); }
}
async function load(){ try{ stage=await api('/api/stage'); await loadExtras(); render(); }
  catch(e){ toast('Could not refresh. We will try again with the next update.','bad'); } }
async function loadExtras(){
  try{ const a=await api('/api/appointments'); appts=a.appointments||[]; }catch(e){ appts=[]; }
  try{ const d=await api('/api/documents'); docs=d.documents||[]; }catch(e){ docs=[]; }
}
function fmtDate(iso){ if(!iso) return '—'; const s=new Date(iso); return s.toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
function capType(t){ return (t||'document').replace(/_/g,' ').replace(/^./,c=>c.toUpperCase()); }

function pTitle(id){const p=(stage.properties||[]).find(x=>x.id===id);return p?`${esc(p.title)} · ${esc(p.area)}`:'a property you own';}

function render(){
  const y=window.scrollY;
  document.getElementById('who').textContent=ME;
  const props=stage.properties||[];
  const pids=props.map(p=>p.id);
  const apps=stage.approvals||[];
  const jobs=stage.jobs||[];
  const flips={}; const note=(k,v)=>{ const p=prevStatus[k]; if(p&&p!==v) flips[k]=1; prevStatus[k]=v; };

  // Approvals with evidence
  const pend=apps.filter(a=>a.status==='pending');
  document.getElementById('my-approvals').innerHTML=pend.length?pend.map(a=>{
    const job=jobs.find(j=>j.id===a.job_id)||{};
    const lim=(stage.authority?.standing_limit_pence||15000)/100;
    return `<div class="card flagged"><div class="cardtop"><h3>${money(a.amount_pence)} — repair sign-off</h3><span class="meta">${when(a.requested_at)}</span></div>
      <div class="meta">${pTitle(a.property_id)}</div>
      <div class="details">“${esc(a.reason)}”</div>
      <table class="evidence">
        <tr><td>Who did the work</td><td><b>${esc(a.evidence?.tradesperson||job.assigned_to||'unknown — chase your agent')}</b>${a.evidence?.tradesperson?' (credentials verified at sign-up)':''}</td></tr>
        <tr><td>Reported by tenant</td><td>${a.evidence?.job_created?new Date(a.evidence.job_created).toLocaleDateString('en-GB'):'—'}</td></tr>
        <tr><td>Work completed</td><td>${a.evidence?.work_completed?new Date(a.evidence.work_completed).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—'}</td></tr>
        <tr><td>Job reference</td><td>${esc(a.job_id)} · case #${esc(job.case_id??'—')}</td></tr>
      </table>
      <div class="fineprint">Above your £${lim.toFixed(0)} standing authority — that's why it reached you and not just the agent.</div>
      <div class="actions"><input placeholder="reason (required if declining)" id="rsn-${esc(a.id)}" autocomplete="off" style="max-width:260px">
        <button class="btn primary" onclick="decide(this,'${esc(a.id)}','approve')">Approve</button>
        <button class="btn danger" onclick="decide(this,'${esc(a.id)}','reject')">Decline</button>
      </div></div>`;}).join('')
    :`<div class="empty" id="appr-empty">Nothing needs your signature. Small works under standing authority are handled by your agent.</div>`;
  const decided=apps.filter(a=>a.status!=='pending').slice().reverse();
  if(decided.length) document.getElementById('my-approvals').insertAdjacentHTML('beforeend',
    `<h2>Recently decided by you</h2>`+decided.slice(0,8).map(a=>`<div class="card"><div class="cardtop"><h3>${money(a.amount_pence)} · ${esc(a.job_id)}</h3><span class="badge ${esc(a.status)}">${a.status}</span></div>
      <div class="meta">${pTitle(a.property_id)} · decided ${when(a.decided_at)}${a.reason_given?' — your words: “'+esc(a.reason_given)+'”':''}</div></div>`).join(''));

  // Statement
  const myJobs=jobs.filter(j=>pids.includes(j.property_id));
  const paid=myJobs.filter(j=>j.status==='paid');
  const paidTotal=paid.reduce((s,j)=>s+(j.invoice_pence||0),0);
  const underLimit=paid.filter(j=>(j.invoice_pence||0)<=((stage.authority?.standing_limit_pence)||15000));
  const awaiting=myJobs.filter(j=>j.status==='awaiting_approval');
  const rentMo=props.reduce((s,p)=>s+p.rent,0);
  document.getElementById('statement').innerHTML=`<div class="card"><div class="grid2" style="gap:0">
    <div><div class="label">Rent in (your ${props.length} properties)</div><div class="money">${money(rentMo)}<span style="font-size:13px;color:var(--muted)"> /mo</span></div></div>
    <div><div class="label">Repairs paid all-time</div><div class="money">${money(paidTotal)}</div><div class="meta">${paid.length} invoice${paid.length===1?'':'s'}${underLimit.length?` · ${underLimit.length} auto-settled under your limit`:''}</div></div>
    <div><div class="label">Awaiting decision</div><div class="money">${awaiting.length?money(awaiting.reduce((s,j)=>s+(j.invoice_pence||0),0)):'—'}</div><div class="meta">${awaiting.length?awaiting.map(j=>esc(j.id)).join(', '):'nothing waiting'}</div></div>
    <div><div class="label">Standing authority</div><div class="money">£${((stage.authority?.standing_limit_pence||15000)/100).toFixed(0)}</div><div class="actions" style="margin-top:6px"><button class="btn ghost" onclick="changeLimit()">Change limit</button></div></div>
  </div>
  <div class="fineprint">Receipts, management-fee breakdown and monthly digests are on the roadmap — the data model already carries every figure shown here.</div></div>`;

  // Cases on my properties (live vocabulary)
  const cases=(stage.cases||[]).filter(c=>pids.includes(c.property_id)).slice().reverse();
  cases.forEach(c=>note('c'+c.id,c.status));
  document.getElementById('my-cases').innerHTML=cases.length?cases.map(c=>`
    <div class="card ${flips['c'+c.id]?'flash-once':''}"><div class="cardtop"><h3>#${c.id}</h3><span class="badge ${esc(c.status)}">${esc(CASE_LABEL[c.status]||c.status)}</span></div>
    <div class="meta">${pTitle(c.property_id)} · ${when(c.status_at||c.submitted_at)}</div>
    <div class="details">${esc(c.message)}</div>${thread(c)}${cMsgs(c)}
    ${c.status==='closed'?'':`<div class="actions"><input placeholder="ask the office something about this…" id="lrp-${c.id}" autocomplete="off" onkeydown="if(event.key==='Enter')landlordReply(${c.id},this)"><button class="btn" onclick="landlordReply(${c.id},this)">Send</button></div>`}</div>`).join('')
    :`<div class="empty">No open work in your buildings. When a tenant reports something it appears here — and any bill above your limit waits for your decision at the top of this page.</div>`;

  document.getElementById('my-props').innerHTML=(props.length?props.map(p=>`
    <div class="card"><h3>${esc(p.title)}</h3><div class="meta">${esc(p.area)} · ${p.beds} bed</div>
    <div class="money">£${(p.rent/100).toFixed(0)}<span style="font-size:13px;color:var(--muted)"> /mo</span></div>
    <div class="meta">${p.tenant?'let to '+esc(p.tenant):'vacant — being let'}</div></div>`).join('')
    :`<div class="empty">No properties on this account yet. Your agent sets up each one — ask them next time you speak.</div>`);

  // Appointments on my properties
  const myPids=props.map(p=>p.id);
  const myAppts=appts.filter(a=>myPids.includes(a.property_id)).slice().sort((a,b)=>a.start_time.localeCompare(b.start_time));
  document.getElementById('my-appts').innerHTML=myAppts.length?myAppts.map(ap=>`<div class="card"><div class="appt">
      <div><div class="date">${fmtDate(ap.start_time)}</div><div class="because">${esc(ap.title)} · ${pTitle(ap.property_id)}${ap.location?' · '+esc(ap.location):''}</div></div>
      <span class="badge ${esc(ap.status)}">${esc(ap.status)}</span></div></div>`).join('')
    :`<div class="empty">Nothing scheduled for your properties. Viewings, inspections and key handovers your agent books will appear here.</div>`;

  // Documents on my properties (pending shown to landlord only when released isn't a thing; show all on-file)
  const myDocs=docs.filter(d=>myPids.includes(d.property_id)&&d.status!=='rejected');
  document.getElementById('my-docs').innerHTML=myDocs.length?myDocs.map(d=>`<div class="card"><div class="docrow">
      <a class="filechip" href="/api/document/${esc(d.id)}/file" target="_blank" rel="noopener">${esc(d.file_name||d.id)}</a>
      <span class="badge ${esc(d.status)}">${esc(d.status)}</span>
      <div class="docmeta">${capType(d.document_type)} · ${pTitle(d.property_id)}${d.verified_at?' · verified':' · awaiting the office'}</div></div></div>`).join('')
    :`<div class="empty">Nothing on file yet. Tenancy agreements and deposit receipts for your properties appear here once the office uploads them.</div>`;
  document.getElementById('main').setAttribute('aria-busy','false');
  if(window.scrollY!==y) window.scrollTo(0,y);
}
function cMsgs(c){ const th=c.thread||[]; if(!th.length) return '';
  return `<details class="msgs"><summary>Conversation · ${th.length}</summary>`+
    th.map(t=>`<div class="msg r-${esc(t.role)}"><b>${esc(t.author)}</b><span class="who"> · ${when(t.at)}</span><div>${esc(t.text)}</div></div>`).join('')+`</details>`;}
async function landlordReply(id,btn){ const el=document.getElementById('lrp-'+id); const v=el.value.trim();
  if(!v){toast('Type your question first.','bad');return;}
  await (btn?Promise.resolve(btn.dataset.busy='1'):0);
  try{ await post('/api/case-action',{id,action:'reply',to:['agent'],text:v}); el.value=''; toast('Sent to the office.'); await load(); }
  catch(e){} finally{ if(btn)delete btn.dataset.busy; } }
function thread(c){const jobs=(stage.jobs||[]).filter(j=>j.case_id===c.id);
  if(!jobs.length)return '';
  return jobs.map(j=>{let bits=[`${esc(j.id)}: ${esc(CASE_LABEL[j.status]||j.status)}`];
    if(j.assigned_to)bits.push(`by ${esc(j.assigned_to)}`);
    if(j.invoice_pence!=null)bits.push(money(j.invoice_pence));
    return `<div class="thread">↳ ${bits.join(' · ')}</div>`;}).join('');}
async function decide(btn,id,action){
  if(btn.dataset.busy) return;
  let reason='';
  if(action==='reject'){reason=document.getElementById('rsn-'+id).value.trim();
    if(!reason){toast('Tell us why — your agent and the tradesperson will see it.','bad');return;}}
  btn.dataset.busy='1';
  try{ await post('/api/landlord-action',{id,action,reason});
    toast(action==='approve'?'Approved — the trade will be settled.':'Declined with your reason; your agent now has a task to fix it.');
    load(); }catch(e){}
  finally{ delete btn.dataset.busy; }
}
function changeLimit(){toast('Limit changes are set up with your agent — ring the office on 0121 496 0123 and they will adjust it for you. The current limit already applies to every invoice on this page.');}
boot(); setInterval(load,20000);
</script>
<button class="to-top" aria-label="Back to top" title="Back to top"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
<script>const tt=document.querySelector('.to-top');
addEventListener('scroll',()=>tt.classList.toggle('visible',window.scrollY>240),{passive:true});
tt.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));</script>
</body>
</html>
