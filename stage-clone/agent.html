<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Desk | Stage</title>
<link rel="stylesheet" href="/dash.css">
</head>
<body>
<div class="shell">
  <header class="header stuck">
    <div class="brand"><h1>Agent Desk</h1><span class="who" id="stamp">…</span></div>
    <nav class="tabs">
      <a href="#" class="tab on" data-view="overview">Overview</a>
      <a href="#" class="tab" data-view="cases">Cases</a>
      <a href="#" class="tab" data-view="jobs">Jobs</a>
      <a href="#" class="tab" data-view="communications">Communications</a>
      <a href="#" class="tab" data-view="tasks">Tasks</a>
      <a href="#" class="tab" data-view="money">Money</a>
      <a href="#" class="tab" data-view="compliance">Compliance</a>
      <a href="#" class="tab" data-view="appointments">Appointments</a>
      <a href="#" class="tab" data-view="documents">Documents</a>
      <a href="#" class="tab" data-view="registrations">Registrations</a>
      <a href="#" class="tab" data-view="prospects">Prospects</a>
      <a href="#" class="tab" data-view="people">People &amp; tenancies</a>
      <a href="#" class="tab" data-view="properties">Properties</a>
      <a href="#" class="tab" data-view="history">History</a>
      <a href="/" class="tab out">Lettings site</a><a href="/logout" class="tab out">Log out</a>
    </nav>
  </header>
  <div id="api-error" class="banner danger" style="display:none">Couldn't reach the portal. <button class="btn" onclick="load(true)">Try again</button></div>
  <main id="main" aria-busy="true">
    <section id="view-overview"></section>
    <section id="view-cases" style="display:none"></section>
    <section id="view-jobs" style="display:none"></section>
    <section id="view-communications" style="display:none"></section>
    <section id="view-tasks" style="display:none"></section>
    <section id="view-money" style="display:none"></section>
    <section id="view-compliance" style="display:none"></section>
    <section id="view-appointments" style="display:none"></section>
    <section id="view-documents" style="display:none"></section>
    <section id="view-registrations" style="display:none"></section>
    <section id="view-prospects" style="display:none"></section>
    <section id="view-people" style="display:none"></section>
    <section id="view-properties" style="display:none"></section>
    <section id="view-history" style="display:none"></section>
  </main>
</div>
<div id="toast-host" aria-live="polite"></div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = p => '£' + ((p ?? 0)/100).toFixed(2);
const ago = iso => { if(!iso) return ''; const m=(Date.now()-new Date(iso))/60000;
  if(m<1)return 'just now'; if(m<60)return Math.round(m)+' min ago'; if(m<1440)return Math.round(m/60)+' h ago'; return Math.round(m/1440)+' days ago'; };
const when = iso => iso ? `<span class="when" title="${esc(new Date(iso).toLocaleString('en-GB'))}">${ago(iso)}</span>` : '';
let stage=null, lastGood='', pool=[], ledgerEntries=[], complianceRecords=[];

async function api(p){const r=await fetch(p);if(!r.ok)throw new Error(p+': '+r.status);return r.json();}
async function post(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
  const j=await r.json().catch(()=>({})); if(!r.ok){toast(j.error||'Something went wrong','bad');throw new Error(j.error);} return j;}
function toast(msg,kind){const el=document.createElement('div');el.className='toast '+(kind||'');el.textContent=msg;
  document.getElementById('toast-host').appendChild(el);setTimeout(()=>el.remove(),3500);}
function busy(btn,fn){ if(!btn){return fn();}
  if(btn.tagName==='INPUT') btn=btn.closest('.actions')?.querySelector('button')||btn;
  if(btn.dataset.busy) return Promise.resolve();
  btn.dataset.busy='1'; return Promise.resolve(fn()).finally(()=>delete btn.dataset.busy); }

function triageLine(t){ if(!t) return '';
  const u=['Routine','Soon','Emergency'][t.urgency]||'?'; const uc=t.urgency>=2?'hot':t.urgency>=1?'warm':'';
  const risk=t.safety>=0.5?`<span class="hot">possible danger ${Math.round(t.safety*100)}%</span>`:`low risk (${Math.round((t.safety||0)*100)}%)`;
  const eng=t.engine==='jev'?'<span class="ok">AI-checked</span>':`<span class="hot">keyword guess — verify yourself</span>`;
  return `<div class="triage-line"><b>${u}</b> · ${esc(t.category)}${t.trade&&t.trade!=='other'?' · '+esc(t.trade):''} · ${risk} · ${eng}</div>`;}
function propLine(pid){const p=(stage.properties||[]).find(x=>x.id===pid);
  return p?`${esc(p.title)} · ${esc(p.area)}`:(pid?esc(pid):'<span class="hot">no property linked</span>');}
function fmtDate(iso){ if(!iso) return '—'; const s=new Date(iso); return s.toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
function capType(t){ return (t||'document').replace(/_/g,' ').replace(/^./,c=>c.toUpperCase()); }
async function apptCancel(btn,id){ await busy(btn,async()=>{ try{ await post('/api/appointment-action',{id,action:'cancel'}); toast('Appointment cancelled — the tenant will be told when they next look.'); load(); }catch(e){} }); }
async function docVerify(btn,id,action){ await busy(btn,async()=>{ try{ await post('/api/document-action',{id,action}); toast(action==='verify'?'Document verified — the tenant can now see their copy.':'Document rejected.'); load(); }catch(e){} }); }
async function docReject(btn,id){ const r=prompt('Why reject this document? (kept on record)')||''; if(!r.trim()){toast('A reason is required to reject.','bad');return;} await busy(btn,async()=>{ try{ await post('/api/document-action',{id,action:'reject',note:r}); toast('Document rejected with your reason on record.'); load(); }catch(e){} }); }

function openBook(btn,cid){ const c=(stage.cases||[]).find(x=>x.id===cid); const pid=c?.property_id;
  const d=prompt('Appointment title','Viewing');
  if(d===null)return;
  const start=prompt('Start time (YYYY-MM-DDTHH:MM) — or blank for tomorrow 10:00');
  const iso=start&&start.trim()?start.trim().replace(' ','T')+'Z':new Date(Date.now()+86400000).toISOString().slice(0,16)+':00Z';
  if(pid){ bookAppt(pid,d||'Viewing',iso); } else toast('This case has no property linked — add one first.','bad'); }
async function bookAppt(pid,title,start){ try{ await post('/api/appointment',{property_id:pid,title,start_time:start,invitee_role:'tenant'}); toast('Viewing booked — the tenant can accept or decline it.'); load(); }catch(e){} }
function openInvite(btn,cid){ const c=(stage.cases||[]).find(x=>x.id===cid); const pid=c?.property_id;
  const email=prompt('Invitee email (so they can join the portal)')||''; if(!email.trim()){toast('An email is needed for the invite.','bad');return;}
  const role=prompt('Role for this invite (tenant / landlord / trades)','tenant')||'tenant';
  if(!pid){toast('This case has no property linked.','bad');return;}
  busy(btn,async()=>{ try{ const r=await post('/api/invitation',{property_id:pid,role:['tenant','landlord','trades'].includes(role)?role:'tenant',email}); toast('Invite sent — link: '+r.invite_url); load(); }catch(e){} }); }
function openUpload(btn,cid){ const c=(stage.cases||[]).find(x=>x.id===cid); const pid=c?.property_id;
  const dtype=prompt('Type (tenancy_agreement / deposit_receipt / inspection_report / id_proof / other)','tenancy_agreement');
  if(dtype===null)return;
  const fname=(prompt('File name','agreement.pdf')||'document').trim();
  const text=prompt('Paste file content (we store it as-is for this demo; real uploads come from the device)','%%PDF-1.4 demo agreement');
  if(!text)return;
  const content_b64=btoa(unescape(encodeURIComponent(text)));
  busy(btn,async()=>{ try{ await post('/api/document',{case_id:cid,property_id:pid||undefined,document_type:dtype||'other',file_name:fname,content_type:'application/pdf',content_b64}); toast('Document uploaded — verify it to release it to the tenant.'); load(); }catch(e){} }); }
function threadFor(c){ const jobs=(stage.jobs||[]).filter(j=>j.case_id===c.id);
  if(!jobs.length) return '';
  return jobs.map(j=>{ let bits=[`job ${esc(j.id)} · ${esc(j.status.replace('_',' '))}`];
    if(j.assigned_to)bits.push(`by ${esc(j.assigned_to)}`);
    if(j.invoice_pence!=null)bits.push(money(j.invoice_pence));
    const ap=(stage.approvals||[]).find(a=>a.job_id===j.id);
    if(ap)bits.push(`landlord: ${esc(ap.status)}${ap.reason_given?' — “'+esc(ap.reason_given)+'”':''}`);
    return `<div class="thread">↳ ${bits.join(' · ')}</div>`;}).join('');}

/* flip tracking: items that changed status between polls get one quiet flash */
let prevStatus={}, FL={flip:{},res:{}};
function markFlips(){ const cur={};
  (stage?.cases||[]).forEach(c=>cur['c'+c.id]=c.status);
  (stage?.jobs||[]).forEach(j=>cur['j'+j.id]=j.status);
  const flip={},res={};
  for(const k in cur){ if(prevStatus[k]&&prevStatus[k]!==cur[k]){flip[k]=1;} }
  prevStatus=cur; FL={flip,res}; }
const fl=k=>FL.flip[k]?'flash-once':'';

async function load(manual){
  try{ stage=await api('/api/stage'); try{ pool=(await api('/api/trades-pool')).trades||[] }catch(e){pool=[]}
    try{ const a=await api('/api/appointments'); window._appts=a.appointments||[] }catch(e){ window._appts=[] }
    try{ const t=await api('/api/tasks'); window._tasks=t.tasks||[] }catch(e){ window._tasks=[] }
    try{ const d=await api('/api/documents'); window._docs=d.documents||[] }catch(e){ window._docs=[] }
    try{ ledgerEntries=(await api('/api/rent-ledger')).entries||[] }catch(e){ ledgerEntries=[] }
    try{ window.landlordStatements=(await api('/api/landlord-statements')).statements||[] }catch(e){ window.landlordStatements=[] }
    try{ complianceRecords=(await api('/api/compliance')).records||[]; window.complianceRecords=complianceRecords }catch(e){ complianceRecords=[]; window.complianceRecords=[] }
    lastGood=new Date().toLocaleTimeString('en-GB');
    document.getElementById('api-error').style.display='none';
    document.getElementById('stamp').textContent='live · updated '+lastGood+' · every 15s';
    document.getElementById('stamp').title='Portal data last refreshed at '+lastGood;
  }catch(e){ document.getElementById('api-error').style.display=stage?'none':'flex'; if(!stage)return; }
  renderAll();
}
function renderAll(){
  const y=window.scrollY, activeId=document.activeElement?.id, activeSelection=(activeId==='desk-search'||activeId==='comm-search')?document.activeElement.selectionStart:null;
    markFlips(); renderOverview(); renderCases(); renderJobs(); renderCommunications(); renderTasks(); renderMoney(); renderCompliance(); renderAppointments(); renderDocuments(); renderRegs(); renderProspects(); renderProps(); renderPeopleTenancies(); renderHistory();
  if(activeId==='desk-search'||activeId==='comm-search'){const input=document.getElementById(activeId);input?.focus();if(activeSelection!==null)input?.setSelectionRange(activeSelection,activeSelection);}
  document.getElementById('main').setAttribute('aria-busy','false');
  if(window.scrollY!==y) window.scrollTo(0,y);
}

let deskSearch='';
function activeRecord(x){return !['closed','resolved','declined','rejected','paid','approved','completed','cancelled','missed'].includes(String(x.status||'').toLowerCase());}
function deskLink(label,detail,view,id,tag){
  return '<a class="appt" href="#" data-view="'+esc(view)+'" data-target="'+esc(id||'')+'" onclick="goDeskResultFrom(this);return false" style="display:flex;color:inherit;text-decoration:none"><div><div><b>'+esc(label)+'</b> '+(tag?'<span class="badge '+esc(tag)+'">'+esc(tag.replace(/_/g,' '))+'</span>':'')+'</div><div class="meta">'+esc(detail)+'</div></div></a>';
}
function goDeskResultFrom(el){goDeskResult(el.dataset.view,el.dataset.target);}
function goDeskResult(view,id){show(view);if(id)setTimeout(()=>document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'center'}),60);}
function deskSearchText(x){return Object.values(x||{}).filter(v=>typeof v==='string'||typeof v==='number').join(' ').toLowerCase();}
function renderDeskSearch(q){
  deskSearch=String(q||'');const host=document.getElementById('desk-search-results');if(!host)return;
  if(deskSearch.trim().length<2){host.innerHTML='<div class="meta">Search names and contacts, properties, cases, jobs, tasks, registrations, appointments and documents.</div>';return;}
  const needle=deskSearch.trim().toLowerCase(),found=[];const prop=id=>(stage.properties||[]).find(p=>p.id===id);
  const add=(rows,view,idFn,labelFn,detailFn)=>{for(const x of rows||[]){const detail=detailFn?detailFn(x):'';if((deskSearchText(x)+' '+detail).toLowerCase().includes(needle))found.push({label:labelFn(x),detail,view,id:idFn? idFn(x):''});}};
  add(stage.properties,'properties',x=>'property-'+x.id,x=>x.title||x.id,x=>x.area||'');
  add(stage.cases,'cases',x=>'case-'+x.id,x=>'Case #'+x.id+' · '+(x.type||'case'),x=>[prop(x.property_id)?.title,x.name,x.email,x.status,x.message].filter(Boolean).join(' · '));
  add(stage.jobs,'jobs',x=>'job-'+x.id,x=>'Job '+x.id+' · case #'+x.case_id,x=>[prop(x.property_id)?.title,x.status,x.assigned_to,x.message].filter(Boolean).join(' · '));
  add(stage.cases,'communications',x=>'comm-case-'+x.id,x=>'Conversation · case #'+x.id,x=>[prop(x.property_id)?.title,x.name,x.email,x.message,(x.thread||[]).map(m=>m.text).join(' ')].filter(Boolean).join(' · '));
  add(stage.registrations,'registrations',x=>'reg-'+x.id,x=>(x.role||'registration')+' · '+(x.name||x.id),x=>[x.email,x.status,x.details].filter(Boolean).join(' · '));
  add(complianceRecords,'compliance',x=>x.id,x=>x.requirement_type.replace(/_/g,' ')+' · '+x.id,x=>[(stage.properties||[]).find(p=>p.id===x.property_id)?.title,x.status,x.expiry_date,x.notes].filter(Boolean).join(' · '));
  add(stage.parties,'people',x=>x.id,x=>x.display_name||x.id,x=>[x.kind,(x.roles||[]).join(', '),x.email,x.phone,x.status].filter(Boolean).join(' · '));
  add(stage.tenancies,'people',x=>x.id,x=>'Tenancy '+x.id,x=>[prop(x.property_id)?.title,(x.tenant_party_ids||[]).map(id=>(stage.parties||[]).find(p=>p.id===id)?.display_name||id).join(', '),x.status].filter(Boolean).join(' · '));
  add(window._appts,'overview',x=>'appointment-'+x.id,x=>x.title||'Appointment',x=>[prop(x.property_id)?.title,x.status,x.start_time,x.description].filter(Boolean).join(' · '));
  add(window._tasks,'tasks',x=>'task-'+x.id,x=>x.title||'Task',x=>[prop(x.property_id)?.title,x.status,x.priority,x.due_date,x.owner,x.description].filter(Boolean).join(' · '));
  add(window._docs,'overview',x=>'doc-'+x.id,x=>x.title||x.file_name||'Document',x=>[prop(x.property_id)?.title,x.document_type,x.status].filter(Boolean).join(' · '));
  host.innerHTML=found.length?found.slice(0,12).map(x=>deskLink(x.label,x.detail,x.view,x.id,'')).join(''):'<div class="empty">No matching records.</div>';
}
function renderAttentionBoard(){
  const now=Date.now(),week=now+7*86400000,props=stage.properties||[],needs=[],waiting=[],upcoming=[],overdue=[];
  const propertyName=id=>{const p=props.find(x=>x.id===id);return p?p.title+' · '+(p.area||''):id||'No property linked';};
  const add=(list,label,detail,view,id,tag)=>list.push({label,detail,view,id,tag});
  (stage.cases||[]).filter(c=>activeRecord(c)&&(c.status==='new'||c.status==='reported'||Number(c.triage?.urgency)>=2)).sort((a,b)=>(Number(b.triage?.urgency)||0)-(Number(a.triage?.urgency)||0)||String(b.submitted_at||'').localeCompare(String(a.submitted_at||''))).forEach(c=>add(needs,'Case #'+c.id+' · '+(c.type||'case'),propertyName(c.property_id)+' · '+(c.name||'Unidentified person'),'cases','case-'+c.id,Number(c.triage?.urgency)>=2?'urgent':c.status));
  (stage.jobs||[]).filter(j=>['open','quoted','pending_verification'].includes(j.status)).forEach(j=>add(needs,'Job '+j.id,propertyName(j.property_id)+' · case #'+j.case_id,'jobs','job-'+j.id,j.status));
  (stage.registrations||[]).filter(x=>x.status==='pending').forEach(x=>add(needs,(x.role||'registration')+' application · '+(x.name||x.id),x.email||'Needs review','registrations','reg-'+x.id,'pending'));
  (window._docs||[]).filter(x=>x.status==='pending').forEach(x=>add(needs,'Verify document · '+(x.title||x.file_name||x.id),propertyName(x.property_id),'overview','doc-'+x.id,'pending'));
  (window.complianceRecords||[]).filter(x=>!['superseded','current'].includes(x.status)||x.reminder_due).forEach(x=>add(needs,x.status==='missing'?'Missing compliance · '+x.requirement_type.replace(/_/g,' '):x.status==='expired'?'Expired compliance · '+x.requirement_type.replace(/_/g,' '):'Compliance reminder · '+x.requirement_type.replace(/_/g,' '),propertyName(x.property_id)+(x.expiry_date?' · expires '+x.expiry_date:''),'compliance',x.id,x.status==='expired'?'overdue':'compliance'));
  (stage.approvals||[]).filter(x=>x.status==='pending').forEach(x=>add(waiting,'Landlord approval · '+(x.id||'request'),propertyName(x.property_id)+' · '+money(x.amount_pence),'jobs',x.job_id?'job-'+x.job_id:'','landlord'));
  (stage.jobs||[]).filter(j=>['quote_requested','assigned','in_progress'].includes(j.status)).forEach(j=>add(waiting,j.status==='quote_requested'?'Quote requested · '+j.id:'Work with trades · '+j.id,propertyName(j.property_id)+' · case #'+j.case_id,'jobs','job-'+j.id,'trades'));
  (window._appts||[]).filter(a=>a.status==='proposed').forEach(a=>add(waiting,'Appointment awaiting reply · '+(a.title||a.id),propertyName(a.property_id)+' · '+fmtDate(a.start_time),'overview','appointment-'+a.id,'invitee'));
  (window._tasks||[]).filter(t=>activeRecord(t)&&t.due_date&&Number.isFinite(Date.parse(t.due_date))&&Date.parse(t.due_date)<=week).forEach(t=>add(t.priority==='urgent'||Date.parse(t.due_date)<now?needs:upcoming,'Task · '+(t.title||t.id),propertyName(t.property_id)+' · due '+fmtDate(t.due_date),'tasks','task-'+t.id,t.priority||'normal'));
  (window._appts||[]).filter(a=>a.status==='confirmed'&&Number.isFinite(Date.parse(a.start_time))&&Date.parse(a.start_time)>=now&&Date.parse(a.start_time)<=week).sort((a,b)=>Date.parse(a.start_time)-Date.parse(b.start_time)).forEach(a=>add(upcoming,a.title||'Appointment',propertyName(a.property_id)+' · '+fmtDate(a.start_time),'overview','appointment-'+a.id,'confirmed'));
  const deadline=x=>x.due_at||x.next_action_at||x.follow_up_at||'';
  const over=(rows,view,prefix,labelFn,detailFn)=>{(rows||[]).forEach(x=>{const d=deadline(x);if(activeRecord(x)&&d&&Number.isFinite(Date.parse(d))&&Date.parse(d)<now)add(overdue,labelFn(x),detailFn(x)+' · due '+fmtDate(d),view,prefix(x),'overdue');});};
  over(stage.cases,'cases',x=>'case-'+x.id,x=>'Case #'+x.id,x=>propertyName(x.property_id));over(stage.jobs,'jobs',x=>'job-'+x.id,x=>'Job '+x.id,x=>propertyName(x.property_id));over(stage.registrations,'registrations',x=>'reg-'+x.id,x=>'Application · '+(x.name||x.id),x=>x.email||'');over(window._appts,'overview',x=>'appointment-'+x.id,x=>x.title||'Appointment',x=>propertyName(x.property_id));over(window._tasks,'tasks',x=>'task-'+x.id,x=>x.title||'Task',x=>propertyName(x.property_id));
  (window._appts||[]).filter(a=>a.status==='confirmed'&&Number.isFinite(Date.parse(a.start_time))&&Date.parse(a.start_time)<now).forEach(a=>add(overdue,'Appointment outcome needs recording · '+(a.title||a.id),propertyName(a.property_id)+' · was '+fmtDate(a.start_time),'overview','appointment-'+a.id,'check'));
  const dayStart=new Date();dayStart.setHours(0,0,0,0);const dayEnd=dayStart.getTime()+86400000;
  const soon=now+60*86400000;
  const bucket=(label,items,view,hot)=>`<a class="stat ${hot&&items.length?'hot':''}" href="#" onclick="show('${esc(view)}');return false"><div class="value">${items.length}</div><div class="label">${esc(label)}</div></a>`;
  const urgentCases=(stage.cases||[]).filter(c=>activeRecord(c)&&c.triage?.category==='maintenance'&&Number(c.triage?.urgency)>=2);
  const safetyCases=(stage.cases||[]).filter(c=>activeRecord(c)&&Number(c.triage?.safety)>=0.75);
  const newTenantEnquiries=(stage.cases||[]).filter(c=>activeRecord(c)&&c.type==='enquiry'&&['renter','tenant'].includes(c.role)&&c.status==='new');
  const newLandlordEnquiries=(stage.registrations||[]).filter(r=>r.role==='landlord'&&r.status==='pending');
  const newTradesApplications=(stage.registrations||[]).filter(r=>r.role==='trades'&&r.status==='pending');
  const approvalsWaiting=(stage.approvals||[]).filter(a=>a.status==='pending');
  const quotesWaiting=(stage.jobs||[]).filter(j=>j.status==='quoted');
  const appointmentsToday=(window._appts||[]).filter(a=>a.status==='confirmed'&&Number.isFinite(Date.parse(a.start_time))&&Date.parse(a.start_time)>=dayStart.getTime()&&Date.parse(a.start_time)<dayEnd);
  const rentArrears=(ledgerEntries||[]).filter(x=>x.status==='overdue'&&(x.balance_pence||0)>0);
  const tenanciesEnding=(stage.tenancies||[]).filter(t=>['notice_given','checkout'].includes(t.status)||(t.end_date&&Number.isFinite(Date.parse(t.end_date))&&Date.parse(t.end_date)>=now&&Date.parse(t.end_date)<=soon));
  const complianceSoon=(window.complianceRecords||[]).filter(x=>['expiring_soon','expired','missing'].includes(x.status)||x.reminder_due);
  const unreadConversations=(stage.cases||[]).filter(caseUnread);
  const tasksDue=(window._tasks||[]).filter(t=>activeRecord(t)&&t.due_date&&Number.isFinite(Date.parse(t.due_date))&&Date.parse(t.due_date)<=week);
  const cockpit='<div class="card"><div class="cardtop"><h3>Today cockpit</h3><span class="badge">'+new Date().toLocaleDateString('en-GB')+'</span></div><div class="stats compact">'+
    bucket('urgent maintenance',urgentCases,'cases',true)+
    bucket('safety critical',safetyCases,'cases',true)+
    bucket('new tenant enquiries',newTenantEnquiries,'prospects',false)+
    bucket('new landlord enquiries',newLandlordEnquiries,'prospects',false)+
    bucket('new trades applications',newTradesApplications,'prospects',false)+
    bucket('approvals waiting',approvalsWaiting,'jobs',true)+
    bucket('quotes waiting',quotesWaiting,'jobs',true)+
    bucket('appointments today',appointmentsToday,'overview',false)+
    bucket('overdue actions',overdue,'overview',true)+
    bucket('rent arrears',rentArrears,'money',true)+
    bucket('tenancies ending soon',tenanciesEnding,'people',false)+
    bucket('compliance due',complianceSoon,'compliance',true)+
    bucket('unread conversations',unreadConversations,'communications',true)+
    bucket('tasks due',tasksDue,'tasks',tasksDue.some(t=>Date.parse(t.due_date)<now||t.priority==='urgent'))+
    '</div></div>';

function caseMessages(c){
 const items=[{author:c.name||'Contact',role:'contact',to:['agent'],text:c.message||'',at:c.submitted_at||'',initial:true}];

 return items.filter(m=>m.text).sort((a,b)=>String(a.at||'').localeCompare(String(b.at||'')));
}
function latestInboundAt(c){

 '<div class="card diary-grid">'+days+'</div>'+
 '<div class="card"><div class="grid2"><label class="field"><span>Search</span><input value="'+esc(window.apptQuery||'')+'" placeholder="Title, participant, case, job or notes" onchange="window.apptQuery=this.value;renderAppointments()"></label><label class="field"><span>Type</span><select id="appt-type-filter" onchange="window.apptType=this.value;renderAppointments()"><option value="">All types</option>'+typeOptions+'</select></label><label class="field"><span>Status</span><select id="appt-status-filter" onchange="window.apptStatus=this.value;renderAppointments()"><option value="">All statuses</option><option value="proposed">Proposed</option><option value="confirmed">Confirmed</option><option value="declined">Declined</option><option value="completed">Completed</option><option value="missed">Missed</option><option value="cancelled">Cancelled</option></select></label><label class="field"><span>Property</span><select id="appt-property-filter" onchange="window.apptProperty=this.value;renderAppointments()"><option value="">All properties</option>'+propOptions+'</select></label></div></div>'+
 '<div class="move">agenda</div>'+(rows||'<div class="empty">No appointments match those filters.</div>');
 const tf=document.getElementById('appt-type-filter'),sf=document.getElementById('appt-status-filter'),pf=document.getElementById('appt-property-filter');if(tf)tf.value=typeFilter;if(sf)sf.value=statusFilter;if(pf)pf.value=propertyFilter;

function localDateTimeValue(id){const v=document.getElementById(id)?.value||'';return v?v+':00Z':'';}
async function createAppointment(btn){
 const roles=Array.from(document.querySelectorAll('input[name="appt-role"]:checked')).map(x=>x.value);
 const partyIds=Array.from(document.getElementById('appt-party')?.selectedOptions||[]).map(x=>x.value);
 await busy(btn,async()=>{try{await post('/api/appointment',{property_id:document.getElementById('appt-property').value,appointment_type:document.getElementById('appt-type').value,title:document.getElementById('appt-title').value,start_time:localDateTimeValue('appt-start'),end_time:localDateTimeValue('appt-end'),reminder_at:localDateTimeValue('appt-reminder'),case_id:document.getElementById('appt-case').value,job_id:document.getElementById('appt-job').value,participant_roles:roles,participant_party_ids:partyIds,location:document.getElementById('appt-location').value,description:document.getElementById('appt-description').value});toast('Appointment added to the diary.');load();}catch(e){}});
}
async function apptAgentAction(btn,id,action){await busy(btn,async()=>{try{await post('/api/appointment-action',{id,action});toast('Appointment updated.');load();}catch(e){}});}
async function apptReschedule(btn,id){const start=prompt('New start time (YYYY-MM-DDTHH:MM)');if(!start)return;const end=prompt('New end time (optional, YYYY-MM-DDTHH:MM)')||'';const note=prompt('Reason / note for reschedule')||'';await busy(btn,async()=>{try{await post('/api/appointment-action',{id,action:'reschedule',start_time:start.replace(' ','T')+':00Z',end_time:end?end.replace(' ','T')+':00Z':'',note});toast('Appointment rescheduled and marked proposed.');load();}catch(e){}});}
async function apptOutcome(btn,id){const outcome=prompt('Outcome to record');if(!outcome)return;await busy(btn,async()=>{try{await post('/api/appointment-action',{id,action:'complete',outcome});toast('Outcome recorded.');load();}catch(e){}});}
function documentExpiryBadge(d){
 if(d.status==='superseded')return '<span class="badge superseded">superseded</span>';
 if(d.status==='rejected')return '<span class="badge rejected">rejected</span>';
 if(!d.expiry_date)return '<span class="badge">no expiry</span>';
 const diff=Math.ceil((Date.parse(d.expiry_date)-Date.now())/86400000);
 if(diff<0)return '<span class="badge overdue">expired</span>';
 if(diff<=30)return '<span class="badge pending">expires soon</span>';
 return '<span class="badge completed">current</span>';
}
function renderDocuments(){
 const docs=window._docs||[],props=stage.properties||[],parties=stage.parties||[],tenancies=stage.tenancies||[],jobs=stage.jobs||[];
 const q=String(window.documentQuery||'').trim().toLowerCase();
 const typeFilter=window.documentType||'',statusFilter=window.documentStatus||'',propertyFilter=window.documentProperty||'';
 const propOptions=props.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.title||p.id)+' · '+esc(p.area||'')+'</option>').join('');
 const partyOptions=parties.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.display_name||p.id)+' · '+esc((p.roles||[]).join(', '))+'</option>').join('');
 const tenancyOptions=tenancies.map(t=>'<option value="'+esc(t.id)+'">'+esc(t.id)+' · '+esc((props.find(p=>p.id===t.property_id)||{}).title||t.property_id)+'</option>').join('');
 const jobOptions=jobs.map(j=>'<option value="'+esc(j.id)+'">'+esc(j.id)+' · case #'+esc(j.case_id||'')+'</option>').join('');
 const docOptions=docs.filter(d=>d.status!=='superseded').map(d=>'<option value="'+esc(d.id)+'">'+esc(d.id)+' · '+esc(d.title||d.file_name||'Document')+'</option>').join('');
 const typeOptions=['property_document','tenancy_agreement','deposit_receipt','inspection_report','id_proof','landlord_document','trades_document','job_document','maintenance_evidence','compliance_certificate','other'].map(t=>'<option value="'+esc(t)+'">'+esc(capType(t))+'</option>').join('');
 const visible=docs.filter(d=>{
   const text=[d.id,d.title,d.description,d.file_name,d.document_type,d.status,d.property_id,d.party_id,d.tenancy_id,d.job_id,(props.find(p=>p.id===d.property_id)||{}).title].filter(Boolean).join(' ').toLowerCase();
   return (!q||text.includes(q))&&(!typeFilter||d.document_type===typeFilter)&&(!statusFilter||d.status===statusFilter)&&(!propertyFilter||d.property_id===propertyFilter);
 });
 const cards=visible.slice().reverse().map(d=>{const p=props.find(x=>x.id===d.property_id)||{},party=parties.find(x=>x.id===d.party_id)||{};return '<div class="card" id="document-'+esc(d.id)+'"><div class="cardtop"><h3>'+esc(d.title||d.file_name||d.id)+'</h3><span class="badge '+esc(d.status||'pending')+'">'+esc(d.status||'pending')+'</span></div>'+
   '<div class="meta">'+esc(capType(d.document_type))+' · '+esc(d.file_name||'file')+' · v'+esc(d.version||1)+(d.expiry_date?' · expires '+esc(d.expiry_date):'')+'</div>'+
   '<div class="meta">'+[p.title,party.display_name,d.tenancy_id,d.job_id,d.case_id?'case #'+d.case_id:''].filter(Boolean).map(esc).join(' · ')+'</div>'+
   '<div class="meta">Access: '+esc((d.access_roles||['agent']).join(', '))+' · '+esc(d.file_size||0)+' bytes</div>'+
   (d.supersedes_id?'<div class="thread">Replaces '+esc(d.supersedes_id)+'</div>':'')+(d.replaced_by_id?'<div class="thread">Replaced by '+esc(d.replaced_by_id)+'</div>':'')+
   '<div class="actions"><a class="btn" href="/api/document/'+esc(d.id)+'/file" target="_blank" rel="noopener">Download</a>'+(d.status==='pending'?'<button class="btn primary" onclick="docVerify(this,\''+esc(d.id)+'\',\'verify\')">Verify</button><button class="btn danger" onclick="docReject(this,\''+esc(d.id)+'\')">Reject</button>':'')+'<button class="btn" onclick="prepareDocumentReplacement(\''+esc(d.id)+'\')">Replace</button></div>'+documentExpiryBadge(d)+'</div>';}).join('');
 document.getElementById('view-documents').innerHTML='<div class="move">document library</div><p class="fineprint">Attach documents to properties, tenancies, people, jobs, cases or compliance records. Access is role-based and downloads use the private file store.</p>'+
 '<div class="stats"><div class="stat"><div class="value">'+docs.length+'</div><div class="label">documents</div></div><div class="stat"><div class="value">'+docs.filter(d=>d.status==='pending').length+'</div><div class="label">to verify</div></div><div class="stat hot"><div class="value">'+docs.filter(d=>documentExpiryBadge(d).includes('expired')).length+'</div><div class="label">expired</div></div></div>'+
 '<div class="card"><h2>Upload document</h2><div class="grid2"><label class="field"><span>File</span><input id="document-file" type="file"></label><label class="field"><span>Document type</span><select id="document-type">'+typeOptions+'</select></label><label class="field"><span>Title</span><input id="document-title" maxlength="120"></label><label class="field"><span>Expiry date</span><input id="document-expiry" type="date"></label><label class="field"><span>Property</span><select id="document-property"><option value="">No direct property</option>'+propOptions+'</select></label><label class="field"><span>Person / organisation</span><select id="document-party"><option value="">No linked person</option>'+partyOptions+'</select></label><label class="field"><span>Tenancy</span><select id="document-tenancy"><option value="">No linked tenancy</option>'+tenancyOptions+'</select></label><label class="field"><span>Job</span><select id="document-job"><option value="">No linked job</option>'+jobOptions+'</select></label><label class="field"><span>Case ID</span><input id="document-case" placeholder="Optional case number"></label><label class="field"><span>Replaces document</span><select id="document-supersedes"><option value="">New document</option>'+docOptions+'</select></label></div><div class="field"><span>Portal access</span><label><input type="checkbox" name="document-access" value="tenant"> Tenant</label> <label><input type="checkbox" name="document-access" value="landlord"> Landlord</label> <label><input type="checkbox" name="document-access" value="trades"> Trades</label></div><label class="field"><span>Description</span><textarea id="document-description" rows="2" maxlength="500"></textarea></label><button class="btn primary" onclick="uploadDocument(this)">Upload document</button></div>'+
 '<div class="card"><div class="grid2"><label class="field"><span>Search</span><input id="document-search" value="'+esc(window.documentQuery||'')+'" placeholder="Title, file, entity, reference" onchange="window.documentQuery=this.value;renderDocuments()"></label><label class="field"><span>Type</span><select id="document-type-filter" onchange="window.documentType=this.value;renderDocuments()"><option value="">All types</option>'+typeOptions+'</select></label><label class="field"><span>Status</span><select id="document-status-filter" onchange="window.documentStatus=this.value;renderDocuments()"><option value="">All statuses</option><option value="pending">Pending</option><option value="verified">Verified</option><option value="rejected">Rejected</option><option value="superseded">Superseded</option></select></label><label class="field"><span>Property</span><select id="document-property-filter" onchange="window.documentProperty=this.value;renderDocuments()"><option value="">All properties</option>'+propOptions+'</select></label></div></div>'+
 '<div class="move">records</div>'+(cards||'<div class="empty">No documents match those filters.</div>');
 const tf=document.getElementById('document-type-filter'),sf=document.getElementById('document-status-filter'),pf=document.getElementById('document-property-filter');
 if(tf)tf.value=typeFilter;if(sf)sf.value=statusFilter;if(pf)pf.value=propertyFilter;
}
function prepareDocumentReplacement(id){show('documents');setTimeout(()=>{const s=document.getElementById('document-supersedes');if(s)s.value=id;document.getElementById('document-file')?.focus();},40);}
async function readFileAsB64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||'').split(',')[1]||'');r.onerror=reject;r.readAsDataURL(file);});}
async function uploadDocument(btn){
 const file=document.getElementById('document-file').files[0];if(!file){toast('Choose a file first.','bad');return;}
 const access=Array.from(document.querySelectorAll('input[name="document-access"]:checked')).map(x=>x.value);
 await busy(btn,async()=>{try{const content_b64=await readFileAsB64(file);await post('/api/document',{file_name:file.name,content_type:file.type||'application/octet-stream',content_b64,document_type:document.getElementById('document-type').value,title:document.getElementById('document-title').value,description:document.getElementById('document-description').value,expiry_date:document.getElementById('document-expiry').value,property_id:document.getElementById('document-property').value,party_id:document.getElementById('document-party').value,tenancy_id:document.getElementById('document-tenancy').value,job_id:document.getElementById('document-job').value,case_id:document.getElementById('document-case').value,supersedes_id:document.getElementById('document-supersedes').value,access_roles:access.length?access:['agent']});toast('Document uploaded to the library.');load();}catch(e){}});
}
function renderHistory(){
  const propOptions=(stage.properties||[]).map(p=>'<option value="'+esc(p.id)+'">'+esc(p.title||p.id)+' · '+esc(p.area||'')+'</option>').join('');
  const propId=window.historyProperty||'',person=String(window.historyPerson||'').trim().toLowerCase(),caseRef=String(window.historyCase||'').trim().toLowerCase(),eventType=String(window.historyEventType||'').trim().toLowerCase();
  const prop=(stage.properties||[]).find(p=>p.id===propId);
  const hay=e=>[e.actor,e.action,e.target,e.note].filter(Boolean).join(' ').toLowerCase();
  const log=(stage.audit_log||[]).slice().reverse().filter(e=>{
    const text=hay(e);
    if(propId&&!(text.includes(propId.toLowerCase())||text.includes(String(prop?.title||'').toLowerCase())))return false;
    if(person&&!text.includes(person))return false;
    if(caseRef&&!text.includes(caseRef.replace(/^case-?/,'').toLowerCase())&&!text.includes(caseRef))return false;
    if(eventType&&!String(e.action||'').toLowerCase().includes(eventType))return false;
    return true;
  });
  document.getElementById('view-history').innerHTML=`<div class="move">activity log</div>
    <div class="card"><div class="grid2">
      <label class="field"><span>Property</span><select id="history-property" onchange="window.historyProperty=this.value;renderHistory()"><option value="">All properties</option>${propOptions}</select></label>
      <label class="field"><span>Person</span><input id="history-person" value="${esc(window.historyPerson||'')}" placeholder="Actor, tenant, landlord or trade" onchange="window.historyPerson=this.value;renderHistory()"></label>
      <label class="field"><span>Case / reference</span><input id="history-case" value="${esc(window.historyCase||'')}" placeholder="Case, job, document or registration" onchange="window.historyCase=this.value;renderHistory()"></label>
      <label class="field"><span>Event type</span><input id="history-event-type" value="${esc(window.historyEventType||'')}" placeholder="approved, created, changed..." onchange="window.historyEventType=this.value;renderHistory()"></label>
    </div></div>`+
    (log.length?`<div class="card"><table class="log">`+log.map(e=>`<tr><td><span class="when" title="${esc(new Date(e.at).toLocaleString('en-GB'))}">${new Date(e.at).toLocaleTimeString('en-GB')}</span></td><td>${esc(e.actor)}</td><td><b>${esc(e.action)}</b> ${esc(e.target||'')}</td><td>${esc(e.note||'')}</td></tr>`).join('')+`</table></div>`:'<div class="empty">No timeline events match those filters.</div>');
  const selected=document.getElementById('history-property');if(selected)selected.value=propId;
}

function show(v){ document.querySelectorAll('.tabs .tab').forEach(t=>t.classList.toggle('on',t.dataset.view===v));
  document.querySelectorAll('[id^=view-]').forEach(s=>s.style.display='none');
  document.getElementById('view-'+v).style.display='block'; }
document.querySelectorAll('.tabs .tab[data-view]').forEach(t=>t.addEventListener('click',e=>{e.preventDefault();show(t.dataset.view);}));

/* sticky-header shadow only once the page actually scrolls */
const head=document.querySelector('.header');
addEventListener('scroll',()=>head.classList.toggle('scrolled',window.scrollY>8),{passive:true});

/* skeleton until the first real data lands */
const skel=n=>Array.from({length:n},()=>'<div class="skel c"></div><div class="skel l"></div>').join('');
document.getElementById('view-overview').innerHTML='<div class="move">what needs you today</div>'+skel(2);
load(); setInterval(load,15000);
