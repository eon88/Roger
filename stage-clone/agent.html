<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Desk | Stage</title>
<link rel="stylesheet" href="/dash.css">
</head>
<body>
<div class="shell">
  <header class="header stuck">
    <div class="brand"><h1>Agent Desk</h1><span class="who" id="stamp">…</span></div>
    <nav class="tabs">
      <a href="#" class="tab on" data-view="overview">Overview</a>
      <a href="#" class="tab" data-view="cases">Cases</a>
      <a href="#" class="tab" data-view="jobs">Jobs</a>
      <a href="#" class="tab" data-view="registrations">Registrations</a>
      <a href="#" class="tab" data-view="properties">Properties</a>
      <a href="#" class="tab" data-view="history">History</a>
      <a href="/" class="tab out">Lettings site</a><a href="/logout" class="tab out">Log out</a>
    </nav>
  </header>
  <div id="api-error" class="banner danger" style="display:none">Couldn't reach the portal. <button class="btn" onclick="load(true)">Try again</button></div>
  <main id="main" aria-busy="true">
    <section id="view-overview"></section>
    <section id="view-cases" style="display:none"></section>
    <section id="view-jobs" style="display:none"></section>
    <section id="view-registrations" style="display:none"></section>
    <section id="view-properties" style="display:none"></section>
    <section id="view-history" style="display:none"></section>
  </main>
</div>
<div id="toast-host" aria-live="polite"></div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = p => '£' + ((p ?? 0)/100).toFixed(2);
const ago = iso => { if(!iso) return ''; const m=(Date.now()-new Date(iso))/60000;
  if(m<1)return 'just now'; if(m<60)return Math.round(m)+' min ago'; if(m<1440)return Math.round(m/60)+' h ago'; return Math.round(m/1440)+' days ago'; };
const when = iso => iso ? `<span class="when" title="${esc(new Date(iso).toLocaleString('en-GB'))}">${ago(iso)}</span>` : '';
let stage=null, lastGood='', pool=[];

async function api(p){const r=await fetch(p);if(!r.ok)throw new Error(p+': '+r.status);return r.json();}
async function post(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
  const j=await r.json().catch(()=>({})); if(!r.ok){toast(j.error||'Something went wrong','bad');throw new Error(j.error);} return j;}
function toast(msg,kind){const el=document.createElement('div');el.className='toast '+(kind||'');el.textContent=msg;
  document.getElementById('toast-host').appendChild(el);setTimeout(()=>el.remove(),3500);}
function busy(btn,fn){ if(!btn){return fn();}
  if(btn.tagName==='INPUT') btn=btn.closest('.actions')?.querySelector('button')||btn;
  if(btn.dataset.busy) return Promise.resolve();
  btn.dataset.busy='1'; return Promise.resolve(fn()).finally(()=>delete btn.dataset.busy); }

function triageLine(t){ if(!t) return '';
  const u=['Routine','Soon','Emergency'][t.urgency]||'?'; const uc=t.urgency>=2?'hot':t.urgency>=1?'warm':'';
  const risk=t.safety>=0.5?`<span class="hot">possible danger ${Math.round(t.safety*100)}%</span>`:`low risk (${Math.round((t.safety||0)*100)}%)`;
  const eng=t.engine==='jev'?'<span class="ok">AI-checked</span>':`<span class="hot">keyword guess — verify yourself</span>`;
  return `<div class="triage-line"><b>${u}</b> · ${esc(t.category)}${t.trade&&t.trade!=='other'?' · '+esc(t.trade):''} · ${risk} · ${eng}</div>`;}
function propLine(pid){const p=(stage.properties||[]).find(x=>x.id===pid);
  return p?`${esc(p.title)} · ${esc(p.area)}`:(pid?esc(pid):'<span class="hot">no property linked</span>');}
function fmtDate(iso){ if(!iso) return '—'; const s=new Date(iso); return s.toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
function capType(t){ return (t||'document').replace(/_/g,' ').replace(/^./,c=>c.toUpperCase()); }
async function apptCancel(btn,id){ await busy(btn,async()=>{ try{ await post('/api/appointment-action',{id,action:'cancel'}); toast('Appointment cancelled — the tenant will be told when they next look.'); load(); }catch(e){} }); }
async function docVerify(btn,id,action){ await busy(btn,async()=>{ try{ await post('/api/document-action',{id,action}); toast(action==='verify'?'Document verified — the tenant can now see their copy.':'Document rejected.'); load(); }catch(e){} }); }
async function docReject(btn,id){ const r=prompt('Why reject this document? (kept on record)')||''; if(!r.trim()){toast('A reason is required to reject.','bad');return;} await busy(btn,async()=>{ try{ await post('/api/document-action',{id,action:'reject',note:r}); toast('Document rejected with your reason on record.'); load(); }catch(e){} }); }

function openBook(btn,cid){ const c=(stage.cases||[]).find(x=>x.id===cid); const pid=c?.property_id;
  const d=prompt('Appointment title','Viewing');
  if(d===null)return;
  const start=prompt('Start time (YYYY-MM-DDTHH:MM) — or blank for tomorrow 10:00');
  const iso=start&&start.trim()?start.trim().replace(' ','T')+'Z':new Date(Date.now()+86400000).toISOString().slice(0,16)+':00Z';
  if(pid){ bookAppt(pid,d||'Viewing',iso); } else toast('This case has no property linked — add one first.','bad'); }
async function bookAppt(pid,title,start){ try{ await post('/api/appointment',{property_id:pid,title,start_time:start,invitee_role:'tenant'}); toast('Viewing booked — the tenant can accept or decline it.'); load(); }catch(e){} }
function openInvite(btn,cid){ const c=(stage.cases||[]).find(x=>x.id===cid); const pid=c?.property_id;
  const email=prompt('Invitee email (so they can join the portal)')||''; if(!email.trim()){toast('An email is needed for the invite.','bad');return;}
  const role=prompt('Role for this invite (tenant / landlord / trades)','tenant')||'tenant';
  if(!pid){toast('This case has no property linked.','bad');return;}
  busy(btn,async()=>{ try{ const r=await post('/api/invitation',{property_id:pid,role:['tenant','landlord','trades'].includes(role)?role:'tenant',email}); toast('Invite sent — link: '+r.invite_url); load(); }catch(e){} }); }
function openUpload(btn,cid){ const c=(stage.cases||[]).find(x=>x.id===cid); const pid=c?.property_id;
  const dtype=prompt('Type (tenancy_agreement / deposit_receipt / inspection_report / id_proof / other)','tenancy_agreement');
  if(dtype===null)return;
  const fname=(prompt('File name','agreement.pdf')||'document').trim();
  const text=prompt('Paste file content (we store it as-is for this demo; real uploads come from the device)','%%PDF-1.4 demo agreement');
  if(!text)return;
  const content_b64=btoa(unescape(encodeURIComponent(text)));
  busy(btn,async()=>{ try{ await post('/api/document',{case_id:cid,property_id:pid||undefined,document_type:dtype||'other',file_name:fname,content_type:'application/pdf',content_b64}); toast('Document uploaded — verify it to release it to the tenant.'); load(); }catch(e){} }); }
function threadFor(c){ const jobs=(stage.jobs||[]).filter(j=>j.case_id===c.id);
  if(!jobs.length) return '';
  return jobs.map(j=>{ let bits=[`job ${esc(j.id)} · ${esc(j.status.replace('_',' '))}`];
    if(j.assigned_to)bits.push(`by ${esc(j.assigned_to)}`);
    if(j.invoice_pence!=null)bits.push(money(j.invoice_pence));
    const ap=(stage.approvals||[]).find(a=>a.job_id===j.id);
    if(ap)bits.push(`landlord: ${esc(ap.status)}${ap.reason_given?' — “'+esc(ap.reason_given)+'”':''}`);
    return `<div class="thread">↳ ${bits.join(' · ')}</div>`;}).join('');}

/* flip tracking: items that changed status between polls get one quiet flash */
let prevStatus={}, FL={flip:{},res:{}};
function markFlips(){ const cur={};
  (stage?.cases||[]).forEach(c=>cur['c'+c.id]=c.status);
  (stage?.jobs||[]).forEach(j=>cur['j'+j.id]=j.status);
  const flip={},res={};
  for(const k in cur){ if(prevStatus[k]&&prevStatus[k]!==cur[k]){flip[k]=1;} }
  prevStatus=cur; FL={flip,res}; }
const fl=k=>FL.flip[k]?'flash-once':'';

async function load(manual){
  try{ stage=await api('/api/stage'); try{ pool=(await api('/api/trades-pool')).trades||[] }catch(e){pool=[]}
    try{ const a=await api('/api/appointments'); window._appts=a.appointments||[] }catch(e){ window._appts=[] }
    try{ const d=await api('/api/documents'); window._docs=d.documents||[] }catch(e){ window._docs=[] }
    lastGood=new Date().toLocaleTimeString('en-GB');
    document.getElementById('api-error').style.display='none';
    document.getElementById('stamp').textContent='live · updated '+lastGood+' · every 15s';
    document.getElementById('stamp').title='Portal data last refreshed at '+lastGood;
  }catch(e){ document.getElementById('api-error').style.display=stage?'none':'flex'; if(!stage)return; }
  renderAll();
}
function renderAll(){
  const y=window.scrollY, searchFocused=document.activeElement?.id==='desk-search';
  const searchPos=searchFocused?document.activeElement.selectionStart:null;
  markFlips(); renderOverview(); renderCases(); renderJobs(); renderRegs(); renderProps(); renderHistory();
  if(searchFocused){const input=document.getElementById('desk-search');input?.focus();if(searchPos!==null)input?.setSelectionRange(searchPos,searchPos);}
  document.getElementById('main').setAttribute('aria-busy','false');
  if(window.scrollY!==y) window.scrollTo(0,y);
}

let deskSearch='';
function activeRecord(x){return !['closed','resolved','declined','rejected','paid','approved','completed','cancelled','missed'].includes(String(x.status||'').toLowerCase());}
function deskLink(label,detail,view,id,tag){
  return '<a class="appt" href="#" data-view="'+esc(view)+'" data-target="'+esc(id||'')+'" onclick="goDeskResultFrom(this);return false" style="display:flex;color:inherit;text-decoration:none"><div><div><b>'+esc(label)+'</b> '+(tag?'<span class="badge '+esc(tag)+'">'+esc(tag.replace(/_/g,' '))+'</span>':'')+'</div><div class="meta">'+esc(detail)+'</div></div></a>';
}
function goDeskResultFrom(el){goDeskResult(el.dataset.view,el.dataset.target);}
function goDeskResult(view,id){show(view);if(id)setTimeout(()=>document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'center'}),60);}
function deskSearchText(x){return Object.values(x||{}).filter(v=>typeof v==='string'||typeof v==='number').join(' ').toLowerCase();}
function renderDeskSearch(q){
  deskSearch=String(q||'');const host=document.getElementById('desk-search-results');if(!host)return;
  if(deskSearch.trim().length<2){host.innerHTML='<div class="meta">Search names and contacts, properties, cases, jobs, registrations, appointments and documents.</div>';return;}
  const needle=deskSearch.trim().toLowerCase(),found=[];const prop=id=>(stage.properties||[]).find(p=>p.id===id);
  const add=(rows,view,idFn,labelFn,detailFn)=>{for(const x of rows||[]){const detail=detailFn?detailFn(x):'';if((deskSearchText(x)+' '+detail).toLowerCase().includes(needle))found.push({label:labelFn(x),detail,view,id:idFn? idFn(x):''});}};
  add(stage.properties,'properties',x=>'property-'+x.id,x=>x.title||x.id,x=>x.area||'');
  add(stage.cases,'cases',x=>'case-'+x.id,x=>'Case #'+x.id+' · '+(x.type||'case'),x=>[prop(x.property_id)?.title,x.name,x.email,x.status,x.message].filter(Boolean).join(' · '));
  add(stage.jobs,'jobs',x=>'job-'+x.id,x=>'Job '+x.id+' · case #'+x.case_id,x=>[prop(x.property_id)?.title,x.status,x.assigned_to,x.message].filter(Boolean).join(' · '));
  add(stage.registrations,'registrations',x=>'reg-'+x.id,x=>(x.role||'registration')+' · '+(x.name||x.id),x=>[x.email,x.status,x.details].filter(Boolean).join(' · '));
  add(window._appts,'overview',x=>'appointment-'+x.id,x=>x.title||'Appointment',x=>[prop(x.property_id)?.title,x.status,x.start_time,x.description].filter(Boolean).join(' · '));
  add(window._docs,'overview',x=>'doc-'+x.id,x=>x.title||x.file_name||'Document',x=>[prop(x.property_id)?.title,x.document_type,x.status].filter(Boolean).join(' · '));
  host.innerHTML=found.length?found.slice(0,12).map(x=>deskLink(x.label,x.detail,x.view,x.id,'')).join(''):'<div class="empty">No matching records.</div>';
}
function renderAttentionBoard(){
  const now=Date.now(),week=now+7*86400000,props=stage.properties||[],needs=[],waiting=[],upcoming=[],overdue=[];
  const propertyName=id=>{const p=props.find(x=>x.id===id);return p?p.title+' · '+(p.area||''):id||'No property linked';};
  const add=(list,label,detail,view,id,tag)=>list.push({label,detail,view,id,tag});
  (stage.cases||[]).filter(c=>activeRecord(c)&&(c.status==='new'||c.status==='reported'||Number(c.triage?.urgency)>=2)).sort((a,b)=>(Number(b.triage?.urgency)||0)-(Number(a.triage?.urgency)||0)||String(b.submitted_at||'').localeCompare(String(a.submitted_at||''))).forEach(c=>add(needs,'Case #'+c.id+' · '+(c.type||'case'),propertyName(c.property_id)+' · '+(c.name||'Unidentified person'),'cases','case-'+c.id,Number(c.triage?.urgency)>=2?'urgent':c.status));
  (stage.jobs||[]).filter(j=>['open','quoted','pending_verification'].includes(j.status)).forEach(j=>add(needs,'Job '+j.id,propertyName(j.property_id)+' · case #'+j.case_id,'jobs','job-'+j.id,j.status));
  (stage.registrations||[]).filter(x=>x.status==='pending').forEach(x=>add(needs,(x.role||'registration')+' application · '+(x.name||x.id),x.email||'Needs review','registrations','reg-'+x.id,'pending'));
  (window._docs||[]).filter(x=>x.status==='pending').forEach(x=>add(needs,'Verify document · '+(x.title||x.file_name||x.id),propertyName(x.property_id),'overview','doc-'+x.id,'pending'));
  (stage.approvals||[]).filter(x=>x.status==='pending').forEach(x=>add(waiting,'Landlord approval · '+(x.id||'request'),propertyName(x.property_id)+' · '+money(x.amount_pence),'jobs',x.job_id?'job-'+x.job_id:'','landlord'));
  (stage.jobs||[]).filter(j=>['quote_requested','assigned','in_progress'].includes(j.status)).forEach(j=>add(waiting,j.status==='quote_requested'?'Quote requested · '+j.id:'Work with trades · '+j.id,propertyName(j.property_id)+' · case #'+j.case_id,'jobs','job-'+j.id,'trades'));
  (window._appts||[]).filter(a=>a.status==='proposed').forEach(a=>add(waiting,'Appointment awaiting reply · '+(a.title||a.id),propertyName(a.property_id)+' · '+fmtDate(a.start_time),'overview','appointment-'+a.id,'invitee'));
  (window._appts||[]).filter(a=>a.status==='confirmed'&&Number.isFinite(Date.parse(a.start_time))&&Date.parse(a.start_time)>=now&&Date.parse(a.start_time)<=week).sort((a,b)=>Date.parse(a.start_time)-Date.parse(b.start_time)).forEach(a=>add(upcoming,a.title||'Appointment',propertyName(a.property_id)+' · '+fmtDate(a.start_time),'overview','appointment-'+a.id,'confirmed'));
  const deadline=x=>x.due_at||x.next_action_at||x.follow_up_at||'';
  const over=(rows,view,prefix,labelFn,detailFn)=>{(rows||[]).forEach(x=>{const d=deadline(x);if(activeRecord(x)&&d&&Number.isFinite(Date.parse(d))&&Date.parse(d)<now)add(overdue,labelFn(x),detailFn(x)+' · due '+fmtDate(d),view,prefix(x),'overdue');});};
  over(stage.cases,'cases',x=>'case-'+x.id,x=>'Case #'+x.id,x=>propertyName(x.property_id));over(stage.jobs,'jobs',x=>'job-'+x.id,x=>'Job '+x.id,x=>propertyName(x.property_id));over(stage.registrations,'registrations',x=>'reg-'+x.id,x=>'Application · '+(x.name||x.id),x=>x.email||'');over(window._appts,'overview',x=>'appointment-'+x.id,x=>x.title||'Appointment',x=>propertyName(x.property_id));
  (window._appts||[]).filter(a=>a.status==='confirmed'&&Number.isFinite(Date.parse(a.start_time))&&Date.parse(a.start_time)<now).forEach(a=>add(overdue,'Appointment outcome needs recording · '+(a.title||a.id),propertyName(a.property_id)+' · was '+fmtDate(a.start_time),'overview','appointment-'+a.id,'check'));
  const panel=(title,items,empty)=>'<div class="card"><div class="cardtop"><h3>'+title+'</h3><span class="badge '+(items.length?'pending':'completed')+'">'+items.length+'</span></div>'+(items.length?items.slice(0,6).map(x=>deskLink(x.label,x.detail,x.view,x.id,x.tag)).join('')+(items.length>6?'<div class="meta">Showing 6 of '+items.length+' matching items.</div>':''):'<div class="meta">'+empty+'</div>')+'</div>';
  return '<div class="move">daily command centre</div><div class="grid2">'+panel('Needs your attention',needs,'Nothing currently needs an agent action.')+panel('Waiting on someone else',waiting,'No open items are marked as waiting on another person.')+panel('Upcoming this week',upcoming,'No confirmed appointments in the next seven days.')+panel('Overdue / needs an update',overdue,'No explicit overdue dates or past confirmed appointments found. Roger only flags recorded deadlines; it does not guess from record age.')+'</div>';
}
function renderOverview(){
  const cases=(stage.cases||[]).filter(c=>!['closed','resolved','declined'].includes(c.status));
  const urg=cases.filter(c=>c.triage&&c.triage.urgency>=2).length;
  const jobs=stage.jobs||[];
  const unassigned=jobs.filter(j=>j.status==='open').length;
  const gated=jobs.filter(j=>j.status==='pending_verification').length;
  const waiting=(stage.approvals||[]).filter(a=>a.status==='pending');
  const settledToday=jobs.filter(j=>j.status==='paid'&&(j.paid_at||'').slice(0,10)===new Date().toISOString().slice(0,10));
  const regs=(stage.registrations||[]).filter(r=>r.status==='pending').length;
  const lim=(stage.authority?.standing_limit_pence||15000)/100;
  const tile=(n,label,view,hot)=>`<a class="stat ${hot?'hot':''}" href="#" onclick="show('${view}');return false"><div class="value">${n}</div><div class="label">${label}</div></a>`;
  const quiet=(urg+gated+unassigned+waiting.length+regs)===0;
  document.getElementById('view-overview').innerHTML=`
      ${renderAttentionBoard()}
      <div class="card"><label class="field"><span>Search Roger</span><input id="desk-search" type="text" value="${esc(deskSearch)}" placeholder="Name, property, case, job or email" aria-label="Search Roger records"></label><div id="desk-search-results" aria-live="polite">${deskSearch?'<div class="meta">Updating search…</div>':'<div class="meta">Search names and contacts, properties, cases, jobs, registrations, appointments and documents.</div>'}</div></div>
      <div class="move">overview</div>
      ${quiet?'<div class="triage-line">All clear today. New reports land here as tenants send them.</div>':''}
      <div class="stats">
        ${tile(urg,'emergencies open','cases',urg>0)}
        ${tile(gated,'bookings needing your verification','jobs',gated>0)}
        ${tile(unassigned,'open jobs nobody took','jobs',unassigned>0)}
        ${tile(waiting.length,'invoices waiting on landlord'+(waiting.length?' · '+waiting.map(a=>money(a.amount_pence)).join(', '):''),'jobs',waiting.length>0)}
        ${tile(money(settledToday.reduce((s,j)=>s+(j.invoice_pence||0),0)),'settled today','jobs')}
        ${tile(regs,'registrations to review','registrations',regs>0)}
      </div>
      <p class="fineprint">Standing authority: invoices up to £${lim.toFixed(0)} settle automatically — the £150 rule lives here so you never have to explain it twice. Above it, the landlord decides.</p>
      ${renderPrimitivesBrief()}`;
   renderDeskSearch(deskSearch);
   const searchInput=document.getElementById('desk-search');
   searchInput?.addEventListener('input',e=>renderDeskSearch(e.target.value));
  function renderPrimitivesBrief(){
    let html='';
    try{ const ap=window._appts||[]; const pend=ap.filter(a=>a.status==='proposed');
      html+=`<div class="card"><div class="cardtop"><h3>Appointments</h3><span class="badge ${pend.length?'pending':'completed'}">${pend.length?'awaiting reply':'none pending'}</span></div>`+
        (ap.length?ap.slice(0,5).map(a=>`<div class="appt" id="appointment-${esc(a.id)}"><div><div class="date">${fmtDate(a.start_time)}</div><div class="because">${esc(a.title)} · ${propLine(a.property_id)} · <span class="badge ${esc(a.status)}">${esc(a.status)}</span></div></div>${a.status==='proposed'?`<div class="actions"><button class="btn ghost" onclick="apptCancel(this,'${esc(a.id)}')">Cancel</button></div>`:''}</div>`).join(''):`<div class="meta">No appointments yet. Book a viewing, inspection or key handover from a case to see it here.</div>`)+`</div>`;
    }catch(e){ html+=''; }
    try{ const docs=window._docs||[]; html+=`<div class="card"><div class="cardtop"><h3>Documents</h3><span class="badge ${docs.some(d=>d.status==='pending')?'pending':'completed'}">${docs.filter(d=>d.status==='pending').length} to verify</span></div>`+
      (docs.length?docs.slice(0,6).map(d=>`<div class="docrow" id="doc-${esc(d.id)}"><a class="filechip" href="/api/document/${esc(d.id)}/file" target="_blank" rel="noopener">${esc(d.file_name||d.id)}</a><span class="badge ${esc(d.status)}">${esc(d.status)}</span><span class="docmeta">${capType(d.document_type)} · ${(stage.properties||[]).find(p=>p.id===d.property_id)?.title||d.property_id}</span>`+(d.status==='pending'?`<div class="actions"><button class="btn ghost" onclick="docVerify(this,'${esc(d.id)}','verify')">Verify</button><button class="btn danger" onclick="docReject(this,'${esc(d.id)}')">Reject</button></div>`:'')+`</div>`).join(''):`<div class="meta">Nothing filed. Upload a tenancy agreement or deposit receipt from a case to see it here.</div>`)+`</div>`;
    }catch(e){}
    return html;
  }
}

function renderCases(){
  const order={new:1,reported:1,dispatched:2,in_progress:2,awaiting_approval:3,resolved:4,declined:4,closed:5,open:1};
  const rank=c=>((c.triage?.urgency>=2)?0:10)+(order[c.status]||1);
  const cases=(stage.cases||[]).slice().sort((a,b)=>rank(a)-rank(b)||b.id-a.id);
  document.getElementById('view-cases').innerHTML=`<div class="move">every case — emergencies first</div>`+
    (cases.length?cases.map(c=>`
    <div id="case-${c.id}" class="card ${c.triage&&c.triage.urgency>=2?'flagged':''} ${fl('c'+c.id)}">
      <div class="cardtop"><h3>#${c.id} · ${esc(c.type||'case')}</h3><span class="badge ${esc(c.status)}">${esc(c.status.replace('_',' '))}</span></div>
      <div class="meta">${propLine(c.property_id)} · ${esc(c.name)}${c.email?' · '+esc(c.email):''} · ${when(c.submitted_at)}</div>
      <div class="details">${esc(c.message)}</div>
      ${triageLine(c.triage)}${threadFor(c)}${msgThread(c)}
      ${c.closed_reason?`<div class="fineprint">Closed: ${esc(c.closed_reason)}</div>`:''}
      ${c.status!=='closed'?`<div class="actions closebox">
        <input placeholder="say something — tenant sees it" id="rp-${c.id}" autocomplete="off" onkeydown="if(event.key==='Enter')replyCase(this,${c.id})">
        <label class="who"><input type="checkbox" id="rpl-${c.id}" checked> landlord</label>
        <label class="who"><input type="checkbox" id="rpt-${c.id}" checked> trades</label>
        <button class="btn primary" onclick="replyCase(this,${c.id})">Send</button>
        <button class="btn" onclick="closeCase(this,${c.id})">Close case</button></div>
      <div class="actions" style="margin-top:6px;flex-wrap:wrap">
        <input placeholder="closing reason (kept on record)" id="cl-${c.id}" autocomplete="off" style="max-width:240px">
        <span class="divider"></span>
        <button class="btn ghost" onclick="openBook(this,${c.id})">Book a viewing</button>
        <button class="btn ghost" onclick="openInvite(this,${c.id})">Send invite</button>
        <button class="btn ghost" onclick="openUpload(this,${c.id})">Upload document</button>
      </div>`:
      `<div class="actions"><button class="btn" onclick="reopenCase(this,${c.id})">Reopen case</button></div>`}
    </div>`).join(''):'<div class="empty">Case book is empty — tenant reports land here the moment they arrive, emergencies first.</div>');
}
async function closeCase(btn,id){ const r=document.getElementById('cl-'+id).value.trim();
  if(!r){toast('A closing reason is required — it stays on the record.','bad');return;}
  await busy(btn,async()=>{ try{ await post('/api/case-action',{id,action:'close',reason:r}); toast('Case #'+id+' closed — logged with your reason.'); load(); }catch(e){} }); }

function msgThread(c){ const th=c.thread||[];
  if(!th.length) return '';
  return `<details class="msgs" open><summary>Conversation · ${th.length} message${th.length===1?'':'s'}</summary>`+
    th.map(t=>`<div class="msg r-${esc(t.role)}"><b>${esc(t.author)}</b><span class="who"> → ${(t.to||[]).join(', ')} · ${ago(t.at)}</span><div>${esc(t.text)}</div></div>`).join('')+`</details>`;}
async function replyCase(btn,id){ const el=document.getElementById('rp-'+id); const v=el.value.trim();
  if(!v){toast('Type the message first — a blank note helps nobody.','bad');return;}
  const to=['tenant']; if(document.getElementById('rpl-'+id).checked)to.push('landlord'); if(document.getElementById('rpt-'+id).checked)to.push('trades');
  await busy(btn,async()=>{ try{ await post('/api/case-action',{id,action:'reply',to,text:v});
    el.value=''; toast('Sent — it lands in their portal.'); load(); }catch(e){} }); }
async function reopenCase(btn,id){ await busy(btn,async()=>{ try{ await post('/api/case-action',{id,action:'reopen'});
  toast('Reopened — back on the active list.'); load(); }catch(e){} }); }
function poolPicker(idSuffix,jobId){ const opts=pool.map(t=>`<option value="${esc(t.company)}">${esc(t.company)} — ${esc(t.trades.join('/'))}${t.gas_safe?' · Gas Safe':''}</option>`).join('');
  return `<select id="pool-${idSuffix}"><option value="">choose trade…</option>${opts}</select>`;}

function renderJobs(){
  const jobs=(stage.jobs||[]).slice().reverse();
  const g=s=>jobs.filter(j=>j.status===s);
  const card=j=>`
    <div id="job-${esc(j.id)}" class="card ${['pending_verification','quoted'].includes(j.status)?'flagged':''} ${fl('j'+j.id)}">
      <div class="cardtop"><h3>${esc(j.id)} · case #${j.case_id}</h3><span class="badge ${esc(j.status)}">${esc(j.status.replace('_',' '))}</span></div>
      <div class="meta">${propLine(j.property_id)}${j.required_trade?` · needs <b>${esc(j.required_trade)}</b>`:''} · ${when(j.created_at)}</div>
      <div class="details">${esc(j.message)}</div>
      ${j.assigned_to?`<div class="meta">${j.status==='quote_requested'?'quote requested from':j.status==='assigned'?'assigned to':'by'} <b>${esc(j.assigned_to)}</b></div>`:''}
      ${j.status==='quoted'&&j.quotes?`<table class="evidence">${j.quotes.map(q=>`<tr><td>${esc(q.tradesperson)} · ${when(q.at)}</td><td><b>${money(q.pence)}</b> ${q.note?esc(q.note):''}</td><td>${q.status==='pending'?`<button class="btn primary" onclick="quoteAct(this,'${esc(j.id)}','approve_quote')">Approve</button> <button class="btn danger" onclick="quoteAct(this,'${esc(j.id)}','decline_quote')">Decline</button>`:esc(q.status)}</td></tr>`).join('')}</table>`:''}
      ${j.gate_reason?`<div class="fineprint hot">Blocked: ${esc(j.gate_reason)} — booked by ${esc(j.requested_by)}</div>
        <div class="actions"><button class="btn primary" onclick="jobAct(this,'${esc(j.id)}','verify_approve')">Allow anyway</button>
        <button class="btn danger" onclick="jobAct(this,'${esc(j.id)}','verify_decline')">Send back</button></div>`:''}
      ${['open'].includes(j.status)?`<div class="actions"><span>${poolPicker(j.id,j.id)}</span>
        <button class="btn" onclick="pickAct(this,'${esc(j.id)}','assign')">Assign directly</button>
        <button class="btn primary" onclick="pickAct(this,'${esc(j.id)}','request_quote')">Ask for quote first</button></div>`:''}
      ${j.status==='assigned'&&j.assigned_to?`<div class="actions"><button class="btn primary" data-who="${esc(j.assigned_to)}" onclick="pickAct(this,'${esc(j.id)}','request_quote')">Ask them to quote first</button></div>`:''}
      ${j.invoice_pence!=null?`<div class="meta">invoice ${money(j.invoice_pence)}${j.approved_quote_pence!=null&&j.invoice_pence>j.approved_quote_pence?` · <span class="amber">above approved quote of ${money(j.approved_quote_pence)}</span>`:''}</div>`:''}
      ${j.status==='paid'&&j.invoice_pence!=null?`<div class="actions"><button class="btn ghost" onclick="jobAct(this,'${esc(j.id)}','send_to_landlord')">Send this invoice to the landlord anyway</button></div>`:''}
    </div>`;
  const sec=(list,title,note,none)=>`<h2>${title}</h2>${note?`<p class="fineprint">${note}</p>`:''}${list.length?list.map(card).join(''):`<div class="empty">${none}</div>`}`;
  document.getElementById('view-jobs').innerHTML=`<div class="move">jobs — who took what</div>`+
    sec(g('quoted'),'Quotes waiting on you','approve a price before anyone visits, or decline and ask again','No quotes in. When a trade replies with a price, it lands here for your yes or no.')+
    sec(g('pending_verification'),'Needs verification','credential mismatch — your call before anyone visits','Nothing held back. A booking appears here only when the trade\'s credentials need your eye.')+
    sec(g('open'),'Unassigned','assign a trusted trade, ask for a quote first, or leave it on the board','No open jobs. Tenant reports become jobs here the moment you dispatch them.')+
    sec(g('assigned'),'Assigned, waiting to start','','Nothing sitting with a trade. Assign one from the open list.')+
    sec(g('quote_requested'),'Waiting on a quote','','No quote is outstanding. Ask a trade for a price from an open job.')+
    sec(g('in_progress'),'In progress','','Nothing on the go. Jobs arrive here once work is green-lit.')+
    sec(g('awaiting_approval'),'Waiting on landlord','','No bills over the standing limit are waiting on a landlord.')+
    sec(g('paid'),'Settled','','Nothing settled yet. Paid invoices move here.')+
    sec(g('rejected'),'Declined by landlord','','No landlord has declined an invoice.');
}
async function pickAct(btn,id,action){ const sel=document.getElementById('pool-'+id);
  const who=(sel?sel.value:'')||btn.dataset.who||'';
  if(!who){toast('Choose a tradesperson from the list first.','bad');return;}
  await jobAct(btn,id,action,who); }
async function jobAct(btn,id,action,tradesperson){ await busy(btn,async()=>{ try{ await post('/api/job-action',{id,action,tradesperson:tradesperson||'agent'});
  const say={verify_approve:'Booking released to the tradesperson.',verify_decline:'Booking sent back — it returns to the open board.',
    assign:'Assigned — they see it on their board now.',request_quote:'Quote requested — it waits on their price.',
    approve_quote:'Quote approved — work is green-lit.',decline_quote:'Quote declined; they\'ve been asked to re-quote or stand down.',
    send_to_landlord:'Invoice sent to the landlord for sign-off.'}[action]||'Done.';
  toast(say); load(); }catch(e){} }); }
function quoteAct(btn,id,action){ const reason=action==='decline_quote'?prompt('Reason for the trade (kept on record):')||'price not right':undefined;
  busy(btn,async()=>{ try{ await post('/api/job-action',{id,action,reason}); toast(action==='approve_quote'?'Quote approved — work is green-lit.':'Quote declined and sent back.'); load(); }catch(e){} }); }

function renderRegs(){
  const all=stage.registrations||[]; const pend=all.filter(r=>r.status==='pending');
  const decided=all.filter(r=>r.status!=='pending').slice().reverse();
  const reg=r=>`<div id="reg-${esc(r.id)}" class="card">
    <div class="cardtop"><h3>${esc(r.name)}</h3><span class="badge ${esc(r.status)}">${esc(r.role)}</span></div>
    <div class="meta">${esc(r.email)}${r.phone?' · '+esc(r.phone):''} · ${when(r.submitted_at)}</div>
    <div class="details">${esc(r.details)}</div>
    ${r.role==='trades'?`<div class="meta">trades: ${esc((r.trades||['not stated']).join(', '))}${r.gas_safe_number?' · Gas Safe '+esc(r.gas_safe_number):' · <span class="hot">no Gas Safe number</span>'}${r.insurance_expiry?' · insurance to '+esc(r.insurance_expiry):''}${r.coverage?' · covers '+esc(r.coverage):''}</div>`:''}
    ${r.property_address?`<div class="meta">${esc(r.property_address)}${r.units?' · '+esc(r.units)+' unit(s)':''}</div>`:''}
    ${r.status==='pending'?`<div class="actions"><input placeholder="note for the record (optional)" id="rn-${esc(r.id)}" autocomplete="off" style="max-width:240px" onkeydown="if(event.key==='Enter')regAct(this,'${esc(r.id)}','approve')">
      <button class="btn primary" onclick="regAct(this,'${esc(r.id)}','approve')">Approve</button>
      <button class="btn danger" onclick="regAct(this,'${esc(r.id)}','reject')">Reject</button></div>`:
      `<div class="fineprint">${esc(r.status)} ${when(r.actioned_at)}${r.decision_note?' — '+esc(r.decision_note):''}</div>`}
  </div>`;
  document.getElementById('view-registrations').innerHTML=`<div class="move">waiting to be approved</div>`+
    (pend.length?pend.map(reg).join(''):'<div class="empty">No registrations waiting. New landlord and tradesperson sign-ups land here for your approval.</div>')+
    (decided.length?`<h2>Decided</h2>`+decided.map(reg).join(''):'');
}
async function regAct(btn,id,action){ await busy(btn,async()=>{ try{ const n=document.getElementById('rn-'+id); const note=n?n.value.trim():'';
  await post('/api/registration-action',{id,action,note}); toast(action==='approve'?'Approved — they can be booked now':'Rejected, with your note on record'); load(); }catch(e){} }); }

function renderProps(){
  document.getElementById('view-properties').innerHTML=`<div class="move">your properties</div><div class="grid2">`+
    (stage.properties||[]).map(p=>`<div id="property-${esc(p.id)}" class="card"><h3>${esc(p.title)}</h3>
      <div class="meta">${esc(p.area)} · ${p.beds} bed</div><div class="money">£${(p.rent/100).toFixed(0)}<span style="font-size:13px;color:var(--muted)"> /mo</span></div>
      <div class="meta">${p.tenant?'let to '+esc(p.tenant):'vacant — being let'} · landlord ${esc(p.landlord)}</div></div>`).join('')+'</div>';
}
function renderHistory(){
  const log=(stage.audit_log||[]).slice().reverse();
  document.getElementById('view-history').innerHTML=`<div class="move">activity log</div>`+
    (log.length?`<div class="card"><table class="log">`+log.map(e=>`<tr><td><span class="when" title="${esc(new Date(e.at).toLocaleString('en-GB'))}">${new Date(e.at).toLocaleTimeString('en-GB')}</span></td><td>${esc(e.actor)}</td><td><b>${esc(e.action)}</b> ${esc(e.target||'')}</td><td>${esc(e.note||'')}</td></tr>`).join('')+`</table></div>`:'<div class="empty">Nothing logged yet. Every decision on this desk writes a line here.</div>');
}

function show(v){ document.querySelectorAll('.tabs .tab').forEach(t=>t.classList.toggle('on',t.dataset.view===v));
  document.querySelectorAll('[id^=view-]').forEach(s=>s.style.display='none');
  document.getElementById('view-'+v).style.display='block'; }
document.querySelectorAll('.tabs .tab[data-view]').forEach(t=>t.addEventListener('click',e=>{e.preventDefault();show(t.dataset.view);}));

/* sticky-header shadow only once the page actually scrolls */
const head=document.querySelector('.header');
addEventListener('scroll',()=>head.classList.toggle('scrolled',window.scrollY>8),{passive:true});

/* skeleton until the first real data lands */
const skel=n=>Array.from({length:n},()=>'<div class="skel c"></div><div class="skel l"></div>').join('');
document.getElementById('view-overview').innerHTML='<div class="move">what needs you today</div>'+skel(2);
load(); setInterval(load,15000);
</script>
<button class="to-top" aria-label="Back to top" title="Back to top"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>

addEventListener('scroll',()=>tt.classList.toggle('visible',window.scrollY>240),{passive:true});
tt.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));</script>
