<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Staff account recovery | Roger</title>
<link rel="stylesheet" href="/dash.css"></head>
<body><div class="shell" style="max-width:520px;padding-top:8vh">
<header class="header"><div class="brand"><h1>Staff password recovery</h1><span class="who">Private one-use recovery link</span></div>
<nav class="tabs"><a href="/login">Sign in</a></nav></header>
<main class="card"><p class="fineprint">This link is valid for 30 minutes. Choose a new, unique password. Your existing authenticator setup stays in place.</p>
<form id="reset">
<div class="field"><label for="password">New password</label><input id="password" type="password" minlength="14" maxlength="128" autocomplete="new-password" required></div>
<div class="field"><label for="confirm">Repeat new password</label><input id="confirm" type="password" minlength="14" maxlength="128" autocomplete="new-password" required></div>
<div class="actions"><button class="btn primary" type="submit">Set new password</button></div>
<p id="feedback" class="fineprint" role="status"></p></form></main></div>
<script>
const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';
history.replaceState(null,'',location.pathname);
document.getElementById('reset').addEventListener('submit',async e=>{
 e.preventDefault();
 const f=document.getElementById('feedback');
 const password=document.getElementById('password').value;
 if(password!==document.getElementById('confirm').value){f.textContent='Passwords do not match.';return;}
 if(!token){f.textContent='Missing recovery token. Ask your agency administrator for a new invitation.';return;}
 try{
 const response=await fetch('/api/security/staff/reset/accept',{method:'POST',cache:'no-store',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({token,new_password:password})});
 const result=await response.json();
 if(!response.ok){f.textContent=result.error||'Could not reset password';return;}
 f.textContent='Password changed. Sign in again.';
 setTimeout(()=>location.replace('/login?changed=1'),700);
 }catch(error){f.textContent='Could not contact the agency';}
});
</script></body></html>
