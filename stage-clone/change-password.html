<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change password | Roger</title>
<link rel="stylesheet" href="/dash.css">
</head>
<body>
<div class="shell" style="max-width:500px;padding-top:7vh">
  <header class="header" style="border:none">
    <div class="brand"><h1>Secure your account</h1><span class="who">Roger agency portal</span></div>
  </header>
  <main class="card">
    <h2>Choose your own password</h2>
    <p class="fineprint">Your temporary agency password must be replaced before you can use the portal.</p>
    <form id="password-form">
      <div class="field"><label for="current">Current password</label><input id="current" type="password" autocomplete="current-password" required></div>
      <div class="field"><label for="next">New password</label><input id="next" type="password" autocomplete="new-password" minlength="14" maxlength="128" required></div>
      <div class="field"><label for="confirm">Repeat new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="14" maxlength="128" required></div>
      <p class="fineprint">Use at least 14 characters. A long, unique passphrase is best. Do not reuse your temporary password.</p>
      <p id="feedback" role="alert" style="color:var(--danger)"></p>
      <div class="actions"><button id="save" type="submit" class="btn primary">Save password</button></div>
    </form>
    <form method="post" action="/logout"><button class="btn" type="submit">Sign out</button></form>
  </main>
</div>
<script>
document.getElementById('password-form').addEventListener('submit',async(e)=>{
  e.preventDefault();
  const current=document.getElementById('current').value;
  const next=document.getElementById('next').value;
  const confirm=document.getElementById('confirm').value;
  const feedback=document.getElementById('feedback');
  if(next!==confirm){feedback.textContent='The new passwords do not match.';return;}
  const save=document.getElementById('save');
  save.disabled=true;feedback.textContent='';
  try{
    const r=await fetch('/api/change-password',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({current_password:current,new_password:next})});
    const result=await r.json();
    if(!r.ok){feedback.textContent=result.error||'Could not change password.';return;}
    location.replace('/login?changed=1');
  }catch(error){feedback.textContent='Could not reach the portal.';}
  finally{save.disabled=false;}
});
</script>
</body>
</html>
