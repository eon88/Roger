<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your jobs | Stage portal</title>
<link rel="stylesheet" href="/dash.css">
</head>
<body>

<div class="shell">
  <header class="header">
    <div class="brand"><h1>Job Board</h1><span class="who">Signed in as <b id="who">R. Doyle Gas &amp; Heat</b></span></div>
    <nav class="tabs">
      <a href="/" class="tab">Lettings site</a>
      <a href="/logout" class="tab">Log out</a>
    </nav>
  </header>
  <main id="main" aria-busy="true">
  <section class="section">
    <div class="move">jobs you can take</div>
    <div id="open-jobs"><div class="skel c"></div><div class="skel l"></div></div>
  </section>

  <section class="section">
    <div class="move">jobs you've taken</div>
    <div id="my-jobs"></div>
  </section>

  <section class="section">
    <div class="move">your invoices and money</div>
    <div id="done-jobs"></div>
  </section>
  </main>
</div>
<div id="toast-host" aria-live="polite"></div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ME = "…";
const money = p => '£' + ((p ?? 0)/100).toFixed(2);
const ago = iso => { if(!iso) return ''; const m=(Date.now()-new Date(iso))/60000;
  if(m<1)return 'just now'; if(m<60)return Math.round(m)+' min ago'; if(m<1440)return Math.round(m/60)+' hours ago'; return Math.round(m/1440)+' days ago'; };
const when = iso => iso ? `<span class="when" title="${esc(new Date(iso).toLocaleString('en-GB'))}">${ago(iso)}</span>` : '';
async function api(p){const r=await fetch(p);if(!r.ok)throw new Error(r.status);return r.json();}
async function post(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
  const j=await r.json().catch(()=>({})); if(!r.ok){toast(j.error||'failed','bad');throw new Error(j.error);} return j;}
function toast(m,k){const el=document.createElement('div');el.className='toast '+(k||'');el.textContent=m;
  document.getElementById('toast-host').appendChild(el);setTimeout(()=>el.remove(),3500);}
function busy(btn,fn){ if(btn&&btn.dataset.busy) return Promise.resolve();
  if(btn) btn.dataset.busy='1';
  return Promise.resolve(fn()).finally(()=>{ if(btn) delete btn.dataset.busy; }); }
let stage, prevStatus={};
async function boot(){
  try{ const w=await api('/api/whoami'); if(!w.role){location='/login';return;} ME=w.display_name; document.getElementById('who').textContent=ME; await load(); }
  catch(e){ toast('Could not reach the portal. Try reloading in a moment.','bad'); }
}
async function load(){ try{ stage=await api('/api/stage'); render(); }
  catch(e){ toast('Could not refresh the board. We will try again shortly.','bad'); } }
function prop(id){const p=(stage.properties||[]).find(x=>x.id===id);return p?`<b>${esc(p.title)}</b> · ${esc(p.area)}`:'address pending from the agent';}
function termsNote(){const lim=(stage.authority?.standing_limit_pence||15000)/100;
  return `<div class="terms">Payment terms: invoices up to £${lim.toFixed(0)} settle the same day under the agency's standing authority. Above it, the landlord signs off first — we chase automatically at 3 days.</div>`;}

function render(){
  const y=window.scrollY;
  const jobs=stage.jobs||[];
  const flips={}; const note=(k,v)=>{ const p=prevStatus[k]; if(p&&p!==v) flips[k]=1; prevStatus[k]=v; };
  jobs.forEach(j=>note('j'+j.id,j.status));

  const open=jobs.filter(j=>j.status==='open').slice().reverse();
  document.getElementById('open-jobs').innerHTML=open.length?open.map(j=>{
    const req=j.required_trade?`<span class="reqtag ${j.required_trade==='gas'?'hot':''}">needs ${esc(j.required_trade)}${j.required_trade==='gas'?' — Gas Safe only':''}</span>`:'';
    const u=['Routine','Soon','Emergency'][j.triage?.urgency]||'';
    return `<div class="card ${j.triage?.urgency>=2?'flagged':''} ${flips['j'+j.id]?'flash-once':''}">
      <div class="cardtop"><h3>${esc(j.id)} · case #${j.case_id}</h3>${req}</div>
      <div class="meta">${prop(j.property_id)} · posted ${when(j.created_at)}</div>
      <div class="details">${esc(j.message)}</div>
      ${j.triage?`<div class="triage-line ${j.triage.urgency>=2?'hot':''}">Triage: <b>${u}</b>${j.triage.safety>=0.5?' · possible danger — trust the agent on this one':' · low risk'}</div>`:''}
      ${termsNote()}
      <div class="actions"><button class="btn primary" onclick="accept(this,'${esc(j.id)}')">Take this job</button></div></div>`;}).join('')
    :`<div class="empty">No open jobs right now. The agent posts work here as tenant reports come in — worth a look each morning.</div>`;

  const mine=jobs.filter(j=>j.status==='in_progress'&&j.assigned_to===ME).slice().reverse();
  const gated=jobs.filter(j=>j.status==='pending_verification'&&j.requested_by===ME);
  document.getElementById('my-jobs').innerHTML=
    (gated.length?gated.map(j=>`<div class="card flagged"><h3>${esc(j.id)} · waiting on the agent</h3>
      <div class="meta">${prop(j.property_id)}</div><div class="details">${esc(j.message)}</div>
      <div class="fineprint">Your booking is held: ${esc(j.gate_reason)}. The agent can release it to you or send it to a verified trade.</div></div>`).join(''):'')+
    (mine.length?mine.map(j=>{const c=(stage.cases||[]).find(x=>x.id===j.case_id)||{};
      return `<div class="card ${flips['j'+j.id]?'flash-once':''}"><div class="cardtop"><h3>${esc(j.id)} · yours since ${when(j.created_at)}</h3></div>
      <div class="meta">${prop(j.property_id)}</div>
      <div class="details">${esc(j.message)}</div>
      <div class="meta">Contact through the office: <a href="tel:+441214960123">0121 496 0123</a> — they confirm who's home and access${c.email?' · reporter email: '+esc(c.email):''}.</div>
      <div class="field" style="margin-top:10px"><label for="inv-${esc(j.id)}">Invoice amount (£)</label>
        <input type="number" id="inv-${esc(j.id)}" min="0" step="0.01" placeholder="0.00" autocomplete="off" style="max-width:140px"></div>
      <div class="actions"><button class="btn primary" onclick="complete(this,'${esc(j.id)}')">Job done — submit invoice</button>
      <button class="btn ghost" onclick="release(this,'${esc(j.id)}')">Hand it back</button></div></div>`;}).join('')
    :gated.length?'':`<div class="empty">Nothing in hand. Accept a job above and it lands here with the invoice box and the tenant's access notes.</div>`);

  const done=jobs.filter(j=>['awaiting_approval','paid','rejected'].includes(j.status)).slice().reverse();
  document.getElementById('done-jobs').innerHTML=done.length?done.map(j=>{
    const appr=(stage.approvals||[]).find(a=>a.job_id===j.id);
    const age=appr?` · waiting ${when(appr.requested_at)}`:'';
    const label={awaiting_approval:`landlord sign-off pending${age} — auto-chased at 3 days`,paid:`settled ${j.paid_at?when(j.paid_at):'recently'} · reference ${esc(j.id)} (demo: settlement is simulated until a payment provider lands)`,rejected:`declined${appr?.reason_given?' — “'+esc(appr.reason_given)+'”':''} · the agent has a task to sort next steps`}[j.status];
    return `<div class="card ${flips['j'+j.id]?'flash-once':''}"><div class="cardtop"><h3>${esc(j.id)} · ${money(j.invoice_pence??0)}</h3>
      <span class="badge ${esc(j.status)}">${j.status==='paid'?'settled':j.status}</span></div>
      <div class="meta">${prop(j.property_id)}</div>
      <div class="fineprint">${label}</div></div>`;}).join('')
    :`<div class="empty">No invoices filed yet. When a job is done, enter the amount on your in-progress card above — small ones settle the same day.</div>`;
  document.getElementById('main').setAttribute('aria-busy','false');
  if(window.scrollY!==y) window.scrollTo(0,y);
}
async function accept(btn,id){ await busy(btn,async()=>{ try{ await post('/api/job-action',{id,action:'accept',tradesperson:ME});
  toast('Booked — details now on your in-progress list.'); load(); }catch(e){} }); }
async function complete(btn,id){ const v=parseFloat(document.getElementById('inv-'+id).value||'0');
  if(v<=0){toast('Enter the invoice amount first.','bad');return;}
  await busy(btn,async()=>{ try{ await post('/api/job-action',{id,action:'complete',invoice_pence:Math.round(v*100),tradesperson:ME});
  toast(v*100<=(stage.authority?.standing_limit_pence||15000)?'Invoice filed — settles under standing authority today.':'Invoice filed — the landlord signs off anything over the limit.'); load(); }catch(e){} }); }
async function release(btn,id){ await busy(btn,async()=>{ try{ await post('/api/job-action',{id,action:'release',tradesperson:ME});
  toast('Handed back — it returns to the open board.'); load(); }catch(e){} }); }
boot(); setInterval(load,20000);
</script>
</body>
</html>
